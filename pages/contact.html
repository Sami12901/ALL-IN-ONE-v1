<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support & Feedback - ALL IN ONE</title>
  <meta name="description" content="Get in touch, report bugs, or submit new utility tool requests. We value your feedback.">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/tools-shared.css">
  <script type="module" src="../js/components.js"></script>
  <link rel="manifest" href="../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
  <script type="module" src="../js/main.js" defer></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container" style="max-width: 650px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">
      <h1 class="gradient-text" style="font-size: 3rem; font-family: var(--font-display); font-weight: 800; text-align: center; margin-bottom: 0.5rem;">Support & Feedback</h1>
      <p style="text-align: center; color: var(--text-secondary); max-width: 500px; margin: 0 auto 1rem;">Have a tool suggestion or found a bug? Let us know. Since the app has no backend database, form submissions are logged locally.</p>
      
      <div class="glass-panel tool-panel">
        <div id="submit-success" class="alert-success" style="display: none; margin-bottom: 1rem;">
          Message simulated successfully! Thank you for your feedback.
        </div>
        
        <form id="contact-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label for="c-name">Full Name</label>
            <input type="text" id="c-name" class="form-input" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="c-email">Email Address</label>
            <input type="email" id="c-email" class="form-input" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="c-type">Inquiry Type</label>
            <select id="c-type" class="form-select">
              <option value="suggest">Request a New Tool</option>
              <option value="bug">Report a Bug / Issue</option>
              <option value="other">General Question</option>
            </select>
          </div>
          <div class="form-group">
            <label for="c-msg">Message Detail</label>
            <textarea id="c-msg" class="form-textarea" required placeholder="Please describe details here..." style="min-height: 120px;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            Submit Inquiry
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contact-form');
      const successMsg = document.getElementById('submit-success');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        successMsg.style.display = 'block';
        form.reset();
        
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 5000);
      });
    });
  </script>
</body>
</html>
