    "@context": "https://schema.org",

      {
        "@type": "ContactPage",
        "@id": "https://sami12901.github.io/ALL-IN-ONE-v1/pages/contact.html#webpage",
        "url": "https://sami12901.github.io/ALL-IN-ONE-v1/pages/contact.html",

        "description": "Contact the developer of ALL IN ONE web utilities suite.",
        "isPartOf": {
          "@type": "WebSite",

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/portfolio.css">
  <link rel="stylesheet" href="../css/tools-shared.css">
  <script type="module" src="../js/components.js"></script>
  <link rel="manifest" href="../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico">
  <script type="module" src="../js/main.js"></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container" style="max-width: 650px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">
      <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800; text-align: center; margin-bottom: 0.5rem;">Support & Feedback</h1>
      <p style="text-align: center; color: var(--text-secondary); max-width: 500px; margin: 0 auto 1rem;">Have a tool suggestion or found an issue? Send a direct note to developer Sami.</p>
      
      <div class="glass-panel tool-panel">
        <form action="https://formsubmit.co/mdsamiislam2006@gmail.com" method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
          
          <!-- Security / Config -->
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_subject" value="New Submission from ALL IN ONE Utilities">
          <input type="hidden" name="_next" value="https://sami12901.github.io/ALL-IN-ONE-v1/pages/contact.html">

          <div class="form-group">
            <label for="c-name">Full Name</label>
            <input type="text" id="c-name" name="name" class="form-input" required placeholder="Your Name">
          </div>
          <div class="form-group">
            <label for="c-email">Email Address</label>
            <input type="email" id="c-email" name="email" class="form-input" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="c-type">Inquiry Type</label>
            <select id="c-type" name="inquiry_type" class="form-select">
              <option value="Request a New Tool">Request a New Tool</option>
              <option value="Report a Bug / Issue">Report a Bug / Issue</option>
              <option value="General Question">General Question</option>
            </select>
          </div>
          <div class="form-group">
            <label for="c-msg">Message Detail</label>
            <textarea id="c-msg" name="message" class="form-textarea" required placeholder="Please describe details here..." style="min-height: 120px;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            Send Message Securely
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>
</body>
</html>
