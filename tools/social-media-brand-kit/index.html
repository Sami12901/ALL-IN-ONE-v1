<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Brand Kit | ALL IN ONE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* Specific overrides for Social Media Brand Kit */
    .brand-kit-container {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 2rem;
      min-height: calc(100vh - 120px);
    }
    
    @media (max-width: 1024px) {
      .brand-kit-container {
        grid-template-columns: 1fr;
      }
    }

    /* Left Panel Styling */
    .config-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: var(--shadow-lg);
      height: max-content;
      position: sticky;
      top: 2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .form-group input[type="text"],
    .form-group input[type="url"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--theme-primary);
      box-shadow: 0 0 0 2px rgba(var(--theme-primary-rgb), 0.2);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-tertiary);
      padding: 0.5rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      background: none;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 4px;
    }

    .color-picker-wrapper input[type="text"] {
      border: none;
      background: none;
      padding: 0;
      width: 100%;
      color: var(--text-primary);
      font-family: monospace;
      font-size: 0.9rem;
    }

    /* Palette Presets */
    .palette-presets {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .preset-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .preset-btn:hover {
      transform: scale(1.1);
    }

    .preset-btn div {
      flex: 1;
      height: 100%;
    }

    /* Right Panel Styling */
    .preview-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      align-items: start;
    }

    .asset-wrapper {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .asset-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .asset-title {
      font-weight: 600;
      color: var(--text-primary);
    }

    .download-btn {
      background: var(--theme-primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    /* Asset Canvases */
    .asset-canvas-container {
      width: 100%;
      position: relative;
      background: #eee;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .asset-canvas {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--brand-bg);
      overflow: hidden;
      transform-origin: top left;
    }

    /* Fixed Aspect Ratio Wrappers */
    #wrap-ig-post { aspect-ratio: 1 / 1; }
    #wrap-ig-story { aspect-ratio: 9 / 16; }
    #wrap-fb-cover { aspect-ratio: 820 / 312; }

    /* Dynamic CSS Variables will be injected inline for styling inside .asset-canvas */
    
    /* Global classes inside assets */
    .asset-logo-img {
      max-width: 100px;
      max-height: 100px;
      object-fit: contain;
    }
    .asset-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      padding: 10%;
      width: 100%;
      height: 100%;
    }
    .asset-hero-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      z-index: 1;
    }
    .asset-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.8));
      z-index: 1;
    }

    /* Theme Styles inside Canvas */
    .asset-canvas {
      font-family: var(--font-body);
      color: var(--brand-text);
      display: flex;
    }
    .asset-heading {
      font-family: var(--font-heading);
      color: var(--brand-primary);
      margin: 0;
      line-height: 1.1;
    }
    .asset-sub {
      color: var(--brand-secondary);
      font-weight: 500;
    }
    .asset-body {
      color: var(--brand-text);
    }
    .asset-accent {
      color: var(--brand-accent);
    }

  </style>
</head>
<body>
  
  <nav class="tool-nav">
    <div class="nav-container">
      <a href="../../index.html" class="back-link">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to Dashboard
      </a>
      <h1 class="nav-title">Social Media Brand Kit</h1>
      <button class="theme-toggle" id="theme-toggle">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </nav>

  <main class="tool-main">
    <div class="brand-kit-container">
      
      <!-- Left Configuration Panel -->
      <div class="config-panel">
        <div>
          <h2 style="font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-primary);">Brand Information</h2>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Brand Name</label>
            <input type="text" id="b-name" value="Lumina" placeholder="e.g. Lumina Jewelry">
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Tagline / Headline</label>
            <input type="text" id="b-tagline" value="Elegance in Every Detail." placeholder="e.g. Elegance in Every Detail.">
          </div>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Call to Action / Website</label>
            <input type="text" id="b-cta" value="www.luminajewelry.com" placeholder="e.g. www.yourbrand.com">
          </div>
          <div class="form-group">
            <label>Logo Image URL (Transparent PNG)</label>
            <input type="url" id="b-logo" value="" placeholder="https://...">
          </div>
        </div>

        <div style="height: 1px; background: var(--border);"></div>

        <div>
          <h2 style="font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-primary);">Visuals</h2>
          <div class="form-group" style="margin-bottom: 1rem;">
            <label>Hero Image URL</label>
            <input type="url" id="b-hero" value="https://images.unsplash.com/photo-1599643478524-fb66f70a00ea?auto=format&fit=crop&w=1080&q=80" placeholder="https://...">
          </div>
          
          <label style="display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.5rem;">Luxury Presets</label>
          <div class="palette-presets" id="palette-presets">
            <!-- Injected via JS -->
          </div>

          <div class="color-grid" style="margin-top: 1rem;">
            <div class="form-group">
              <label>Primary Color</label>
              <div class="color-picker-wrapper">
                <input type="color" id="c-primary" value="#d4af37">
                <input type="text" id="t-primary" value="#d4af37">
              </div>
            </div>
            <div class="form-group">
              <label>Secondary Color</label>
              <div class="color-picker-wrapper">
                <input type="color" id="c-secondary" value="#ffffff">
                <input type="text" id="t-secondary" value="#ffffff">
              </div>
            </div>
            <div class="form-group">
              <label>Background Color</label>
              <div class="color-picker-wrapper">
                <input type="color" id="c-bg" value="#0f172a">
                <input type="text" id="t-bg" value="#0f172a">
              </div>
            </div>
            <div class="form-group">
              <label>Text Color</label>
              <div class="color-picker-wrapper">
                <input type="color" id="c-text" value="#f8fafc">
                <input type="text" id="t-text" value="#f8fafc">
              </div>
            </div>
          </div>
        </div>

        <div style="height: 1px; background: var(--border);"></div>

        <div>
          <h2 style="font-size: 1.25rem; margin-bottom: 1rem; color: var(--text-primary);">Typography</h2>
          <div class="form-group">
            <label>Font Pairing</label>
            <select id="b-fonts">
              <option value="cinzel-inter">Cinzel (Heading) + Inter (Body)</option>
              <option value="playfair-montserrat">Playfair Display (Heading) + Montserrat (Body)</option>
              <option value="montserrat-inter">Montserrat (Heading) + Inter (Body)</option>
              <option value="inter-inter">Inter (Heading & Body)</option>
            </select>
          </div>
        </div>
        
      </div>
      
      <!-- Right Preview Panel -->
      <div class="preview-panel">
        
        <!-- Instagram Post -->
        <div class="asset-wrapper">
          <div class="asset-header">
            <div class="asset-title">Instagram Post <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 400;">(1080x1080)</span></div>
            <button class="download-btn" data-target="canvas-ig-post" data-filename="instagram-post.png">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Save
            </button>
          </div>
          <div class="asset-canvas-container" id="wrap-ig-post">
            <div class="asset-canvas" id="canvas-ig-post" style="width: 1080px; height: 1080px; justify-content: center; align-items: center; text-align: center;">
              <!-- Dynamic Background/Image -->
              <img src="" class="asset-hero-img dyn-hero" alt="" crossorigin="anonymous">
              <div class="asset-overlay" style="background: rgba(var(--brand-bg-rgb), 0.75);"></div>
              
              <!-- Content -->
              <div class="asset-content" style="justify-content: center; align-items: center; gap: 30px;">
                <img src="" class="asset-logo-img dyn-logo" style="display: none; max-width: 200px; max-height: 200px;" crossorigin="anonymous">
                <div style="font-family: var(--font-heading); color: var(--brand-primary); font-size: 130px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em;" class="dyn-name"></div>
                <div style="font-family: var(--font-body); color: var(--brand-secondary); font-size: 45px; font-weight: 300;" class="dyn-tagline"></div>
                <div style="margin-top: 40px; padding: 20px 40px; border: 4px solid var(--brand-primary); color: var(--brand-primary); font-family: var(--font-body); font-weight: 600; font-size: 35px; letter-spacing: 2px; text-transform: uppercase;" class="dyn-cta"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Instagram Story -->
        <div class="asset-wrapper">
          <div class="asset-header">
            <div class="asset-title">Instagram Story <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 400;">(1080x1920)</span></div>
            <button class="download-btn" data-target="canvas-ig-story" data-filename="instagram-story.png">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Save
            </button>
          </div>
          <div class="asset-canvas-container" id="wrap-ig-story">
            <div class="asset-canvas" id="canvas-ig-story" style="width: 1080px; height: 1920px; flex-direction: column;">
              <img src="" class="asset-hero-img dyn-hero" alt="" crossorigin="anonymous">
              <div class="asset-overlay" style="background: linear-gradient(to bottom, rgba(var(--brand-bg-rgb), 0.2), rgba(var(--brand-bg-rgb), 0.95));"></div>
              
              <div class="asset-content" style="justify-content: flex-end; padding-bottom: 300px; padding-left: 100px; padding-right: 100px;">
                <img src="" class="asset-logo-img dyn-logo" style="display: none; margin-bottom: 40px; max-width: 250px; max-height: 250px;" crossorigin="anonymous">
                <div style="font-family: var(--font-heading); color: var(--brand-primary); font-size: 160px; font-weight: 700; line-height: 1; margin-bottom: 20px;" class="dyn-name"></div>
                <div style="font-family: var(--font-body); color: var(--brand-text); font-size: 55px; font-weight: 400; line-height: 1.4; margin-bottom: 60px;" class="dyn-tagline"></div>
                <div style="background: var(--brand-primary); color: var(--brand-bg); display: inline-block; padding: 30px 60px; font-family: var(--font-body); font-weight: 600; font-size: 40px; text-transform: uppercase; border-radius: 8px; align-self: flex-start;" class="dyn-cta"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Facebook Cover -->
        <div class="asset-wrapper" style="grid-column: 1 / -1;">
          <div class="asset-header">
            <div class="asset-title">Facebook Cover <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 400;">(820x312)</span></div>
            <button class="download-btn" data-target="canvas-fb-cover" data-filename="facebook-cover.png">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Save
            </button>
          </div>
          <div class="asset-canvas-container" id="wrap-fb-cover">
            <div class="asset-canvas" id="canvas-fb-cover" style="width: 820px; height: 312px; align-items: center;">
              <img src="" class="asset-hero-img dyn-hero" alt="" crossorigin="anonymous">
              <div class="asset-overlay" style="background: linear-gradient(to right, rgba(var(--brand-bg-rgb), 0.95) 30%, rgba(var(--brand-bg-rgb), 0.2));"></div>
              
              <div class="asset-content" style="justify-content: center; width: 60%; padding: 40px;">
                <img src="" class="asset-logo-img dyn-logo" style="display: none; margin-bottom: 15px; max-width: 80px; max-height: 80px;" crossorigin="anonymous">
                <div style="font-family: var(--font-heading); color: var(--brand-primary); font-size: 40px; font-weight: 700; line-height: 1.1;" class="dyn-name"></div>
                <div style="font-family: var(--font-body); color: var(--brand-secondary); font-size: 16px; font-weight: 400; margin-top: 8px;" class="dyn-tagline"></div>
                <div style="color: var(--brand-text); font-family: var(--font-body); font-weight: 500; font-size: 14px; margin-top: 25px; display: flex; align-items: center; gap: 10px;">
                  <span style="display: inline-block; width: 30px; height: 2px; background: var(--brand-primary);"></span>
                  <span class="dyn-cta"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
