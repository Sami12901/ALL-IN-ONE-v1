<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Full-featured scientific calculator with trigonometry, logarithms, powers, memory, and history. Works offline.">
  <meta name="keywords" content="calculator, scientific, trig, math, equations, sin, cos, tan, log, ln, free, online">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/scientific-calculator/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
  <script type="module" src="../../js/main.js" defer></script>

  <style>
    .calc-wrapper {
      max-width: 480px;
      margin: 2rem auto;
    }

    /* Display */
    .calc-display {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .calc-expression {
      font-size: 0.9rem;
      color: var(--text-tertiary);
      min-height: 1.4em;
      word-break: break-all;
      text-align: right;
      width: 100%;
    }

    .calc-result {
      font-size: 2.5rem;
      font-weight: 800;
      font-family: var(--font-display);
      color: var(--text-primary);
      word-break: break-all;
      text-align: right;
      width: 100%;
      line-height: 1.2;
      transition: font-size 0.15s ease;
    }

    .calc-result.small { font-size: 1.8rem; }

    /* Memory indicator */
    .memory-indicator {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.05em;
      min-height: 1em;
    }

    /* Button Grid */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }

    .calc-btn {
      padding: 0.85rem 0.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .calc-btn:hover {
      background: var(--bg-tertiary);
      transform: translateY(-1px);
    }

    .calc-btn:active {
      transform: translateY(0);
      background: var(--accent-glow);
    }

    .calc-btn.op {
      background: var(--bg-tertiary);
      color: var(--accent-light);
      font-weight: 700;
    }

    .calc-btn.fn {
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: var(--bg-primary);
    }

    .calc-btn.fn:hover {
      color: var(--accent-light);
    }

    .calc-btn.equals {
      background: var(--accent-gradient);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 800;
      border: none;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .calc-btn.equals:hover {
      opacity: 0.9;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .calc-btn.clear {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      font-weight: 700;
    }

    .calc-btn.clear:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .calc-btn.mem {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-tertiary);
      background: var(--bg-primary);
      border-color: transparent;
    }
    .calc-btn.mem:hover { color: var(--accent); }

    /* Mode toggle */
    .mode-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .mode-btn {
      flex: 1;
      padding: 0.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      color: var(--text-tertiary);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .mode-btn.active {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* History */
    .history-panel {
      margin-top: 1.5rem;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-clear {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      cursor: pointer;
      background: none;
      border: none;
      font-weight: 600;
    }
    .history-clear:hover { color: #ef4444; }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .history-item:hover { background: var(--bg-tertiary); }
    .history-expr { color: var(--text-tertiary); }
    .history-val { color: var(--text-primary); font-weight: 700; }

    @media (max-width: 500px) {
      .calc-wrapper { margin: 1rem auto; }
      .calc-btn { padding: 0.7rem 0.15rem; font-size: 0.85rem; }
      .calc-btn.fn { font-size: 0.7rem; }
      .calc-result { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center;">
        <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">Scientific Calculator</h1>
        <p class="tool-description">Full-featured scientific calculator with trig, logarithms, powers, factorials, memory, and history.</p>
      </div>

      <div class="calc-wrapper">
        <div class="glass-panel" style="padding: 1.25rem;">

          <!-- Display -->
          <div class="calc-display">
            <div class="memory-indicator" id="mem-indicator"></div>
            <div class="calc-expression" id="expression"></div>
            <div class="calc-result" id="result">0</div>
          </div>

          <!-- Angle Mode -->
          <div class="mode-bar">
            <button class="mode-btn active" data-mode="deg" id="mode-deg">DEG</button>
            <button class="mode-btn" data-mode="rad" id="mode-rad">RAD</button>
            <button class="mode-btn" data-mode="2nd" id="mode-2nd">2nd</button>
          </div>

          <!-- Memory Row -->
          <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 0.5rem;">
            <button class="calc-btn mem" data-action="mc">MC</button>
            <button class="calc-btn mem" data-action="mr">MR</button>
            <button class="calc-btn mem" data-action="m+">M+</button>
            <button class="calc-btn mem" data-action="m-">M−</button>
            <button class="calc-btn mem" data-action="ms">MS</button>
          </div>

          <!-- Main Buttons -->
          <div class="calc-grid" id="calc-buttons">
            <!-- Row 1: Scientific -->
            <button class="calc-btn fn" data-action="sin">sin</button>
            <button class="calc-btn fn" data-action="cos">cos</button>
            <button class="calc-btn fn" data-action="tan">tan</button>
            <button class="calc-btn fn" data-action="log">log</button>
            <button class="calc-btn fn" data-action="ln">ln</button>

            <!-- Row 2: More Sci -->
            <button class="calc-btn fn" data-action="sqrt">√</button>
            <button class="calc-btn fn" data-action="pow">x<sup>y</sup></button>
            <button class="calc-btn fn" data-action="sq">x²</button>
            <button class="calc-btn fn" data-action="inv">1/x</button>
            <button class="calc-btn fn" data-action="fact">n!</button>

            <!-- Row 3: Parens, pi, e, % -->
            <button class="calc-btn fn" data-action="(">(</button>
            <button class="calc-btn fn" data-action=")">)</button>
            <button class="calc-btn fn" data-action="pi">π</button>
            <button class="calc-btn fn" data-action="e">e</button>
            <button class="calc-btn fn" data-action="%">%</button>

            <!-- Row 4: 7 8 9 DEL AC -->
            <button class="calc-btn" data-action="7">7</button>
            <button class="calc-btn" data-action="8">8</button>
            <button class="calc-btn" data-action="9">9</button>
            <button class="calc-btn clear" data-action="del">DEL</button>
            <button class="calc-btn clear" data-action="ac">AC</button>

            <!-- Row 5: 4 5 6 × ÷ -->
            <button class="calc-btn" data-action="4">4</button>
            <button class="calc-btn" data-action="5">5</button>
            <button class="calc-btn" data-action="6">6</button>
            <button class="calc-btn op" data-action="*">×</button>
            <button class="calc-btn op" data-action="/">÷</button>

            <!-- Row 6: 1 2 3 + - -->
            <button class="calc-btn" data-action="1">1</button>
            <button class="calc-btn" data-action="2">2</button>
            <button class="calc-btn" data-action="3">3</button>
            <button class="calc-btn op" data-action="+">+</button>
            <button class="calc-btn op" data-action="-">−</button>

            <!-- Row 7: +/- 0 . Ans = -->
            <button class="calc-btn fn" data-action="negate">±</button>
            <button class="calc-btn" data-action="0">0</button>
            <button class="calc-btn" data-action=".">.</button>
            <button class="calc-btn fn" data-action="ans">ANS</button>
            <button class="calc-btn equals" data-action="=">=</button>
          </div>

          <!-- History -->
          <div class="history-panel" id="history-panel" style="display: none;">
            <div class="history-title">
              <span>History</span>
              <button class="history-clear" id="clear-history">Clear</button>
            </div>
            <div class="history-list" id="history-list"></div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Scientific Calculator",
    "url": "https://sami12901.github.io/ALL-IN-ONE-v1/tools/scientific-calculator/",
    "description": "Full-featured scientific calculator with trigonometry, logarithms, powers, memory, and history.",
    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>

  <script src="script.js"></script>
</body>
</html>
