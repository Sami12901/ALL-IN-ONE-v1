  <style>
    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    
    .editor-card { background: var(--surface); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .options-card { background: rgba(0,0,0,0.3); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; display: flex; flex-direction: column; gap: 1rem; height: fit-content; }
    
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  </style>

<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container" style="max-width: 1200px;">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>Text to PDF</h1>
        <p class="tool-description">Paste your raw text, configure your font settings, and instantly generate a formatted, paginated PDF document.</p>
      </div>

      <div class="layout">
        
        <div class="editor-card glass-panel">
          <div class="form-group" style="height: 100%;">
            <label>Document Content</label>
            <textarea id="pdf-text" class="form-input" style="height: 400px; resize: vertical; font-family: monospace; font-size: 1rem;" placeholder="Start typing or paste your text here..."></textarea>
          </div>
        </div>

        <div class="options-card glass-panel">
          <div class="form-group">
            <label>Font Family</label>
            <select id="pdf-font" class="form-input">
              <option value="helvetica" selected>Helvetica (Clean)</option>
              <option value="times">Times New Roman (Formal)</option>
              <option value="courier">Courier (Monospace)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Font Size</label>
            <input type="number" id="pdf-size" class="form-input" value="12" min="8" max="72">
          </div>
          <div class="form-group">
            <label>Line Height</label>
            <input type="number" id="pdf-line-height" class="form-input" value="1.5" step="0.1" min="1" max="3">
          </div>
          <div class="form-group">
            <label>Page Size</label>
            <select id="pdf-format" class="form-input">
              <option value="a4" selected>A4</option>
              <option value="letter">US Letter</option>
            </select>
          </div>
          
          <button class="btn btn-primary" id="btn-execute" style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem; margin-top: 1rem;">
            Generate PDF
          </button>
        </div>

      </div>
    </div>
  </main>
