<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Page Numbers - ALL IN ONE</title>
  <meta name="description" content="Add page numbers to your PDF document instantly and securely.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- Standard font support -->
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.js"></script>

  <style>
    .layout { display: flex; flex-direction: column; gap: 2rem; max-width: 800px; margin: 0 auto; }
    
    .upload-zone { border: 2px dashed var(--stroke); border-radius: 1rem; padding: 3rem 2rem; text-align: center; background: rgba(0,0,0,0.2); transition: all 0.2s; cursor: pointer; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.05); }

    .file-info-card { background: var(--surface); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; display: flex; align-items: center; gap: 1.5rem; }
    .file-icon { color: #ef4444; }
    .file-details { flex-grow: 1; overflow: hidden; }
    .file-name { font-weight: 600; font-size: 1.1rem; color: var(--text); margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
    
    .options-card { background: rgba(0,0,0,0.3); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  </style>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>Add Page Numbers</h1>
        <p class="tool-description">Insert automatic page numbers onto every page of your PDF.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        
        <div class="upload-zone" id="upload-zone">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1" fill="none" style="margin-bottom: 1rem; color: var(--muted);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <h3 style="margin-bottom: 0.5rem;">Drop a PDF file here</h3>
          <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">or click to browse</p>
          <button class="btn btn-secondary" id="btn-browse" style="margin: 0 auto;">Select PDF</button>
          <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        </div>
        
        <div id="workspace" style="display: none;">
          <div class="file-info-card">
            <svg class="file-icon" viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
            <div class="file-details">
              <div class="file-name" id="ui-filename">document.pdf</div>
            </div>
            <button class="btn btn-secondary" id="btn-change" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Change File</button>
          </div>

          <div class="options-card" style="margin-top: 1.5rem;">
            
            <div class="options-grid">
              <div class="form-group">
                <label>Position</label>
                <select id="pn-position" class="form-input">
                  <option value="bottom-center">Bottom Center</option>
                  <option value="bottom-left">Bottom Left</option>
                  <option value="bottom-right">Bottom Right</option>
                  <option value="top-center">Top Center</option>
                  <option value="top-left">Top Left</option>
                  <option value="top-right">Top Right</option>
                </select>
              </div>
              <div class="form-group">
                <label>Format</label>
                <select id="pn-format" class="form-input">
                  <option value="{n}">1, 2, 3</option>
                  <option value="Page {n}">Page 1, Page 2, Page 3</option>
                  <option value="{n} of {total}">1 of 10, 2 of 10</option>
                  <option value="Page {n} of {total}">Page 1 of 10</option>
                </select>
              </div>
            </div>
            
            <div class="options-grid">
              <div class="form-group">
                <label>Starting Number</label>
                <input type="number" id="pn-start" class="form-input" value="1" min="1">
              </div>
              <div class="form-group">
                <label>Font Size</label>
                <input type="number" id="pn-size" class="form-input" value="12" min="8" max="72">
              </div>
            </div>

            <button class="btn btn-primary" id="btn-execute" style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem; margin-top: 1rem;">
              Add Page Numbers & Download
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
