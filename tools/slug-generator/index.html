<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Slug Generator - ALL IN ONE</title>
  <meta name="description" content="Generate clean, SEO-friendly URL slugs instantly.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .slug-layout {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }
    .result-box {
      position: relative;
      background: rgba(15, 15, 15, 0.4);
      border: 1px solid var(--stroke);
      border-radius: 1rem;
      padding: 1.5rem;
      font-size: 1.25rem;
      font-family: var(--font-mono);
      color: var(--accent);
      min-height: 80px;
      display: flex;
      align-items: center;
      word-break: break-all;
    }
    .copy-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--surface);
      border: 1px solid var(--stroke);
      color: var(--text);
      padding: 0.35rem 1rem;
      border-radius: 99px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .copy-btn:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>URL Slug Generator</h1>
        <p class="tool-description">Instantly convert any text into a clean, SEO-friendly URL slug.</p>
      </div>

      <div class="tool-panel glass-panel slug-layout">
        <div>
          <label style="font-weight: 600; font-size: 1rem; display: block; margin-bottom: 0.5rem;">Enter Title or Phrase</label>
          <input type="text" id="input-title" class="form-input" style="width: 100%; font-size: 1.1rem; padding: 1rem;" placeholder="e.g. 10 Best Ways to Learn JavaScript in 2026!">
        </div>
        
        <div>
          <label style="font-weight: 600; font-size: 1rem; display: block; margin-bottom: 0.5rem;">Generated Slug</label>
          <div class="result-box">
            <span id="output-slug">10-best-ways-to-learn-javascript-in-2026</span>
            <button class="copy-btn" id="btn-copy">Copy Slug</button>
          </div>
        </div>
        
        <div style="color: var(--muted); font-size: 0.85rem;">
          <strong>Tip:</strong> A good URL slug is short, descriptive, lowercase, and uses hyphens (-) to separate words. It helps search engines and humans read your links perfectly.
        </div>
      </div>
    </div>
  </main>
</body>
</html>
