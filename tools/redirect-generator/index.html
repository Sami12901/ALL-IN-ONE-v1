<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirect Code Generator - ALL IN ONE</title>
  <meta name="description" content="Generate 301 redirects for Apache, Nginx, or PHP.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .output-box {
      background: rgba(0,0,0,0.5); border: 1px solid var(--stroke); border-radius: 0.5rem;
      padding: 1.5rem; font-family: var(--font-mono); font-size: 0.9rem; color: #34d399;
      white-space: pre-wrap; word-break: break-all; min-height: 200px;
    }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Redirect Code Generator</h1>
        <p class="tool-description">Instantly generate 301 (Permanent) or 302 (Temporary) redirect codes for your server.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          
          <div class="form-group">
            <label>Server Type / Language</label>
            <select id="server-type" class="form-input">
              <option value="apache">Apache (.htaccess)</option>
              <option value="nginx">Nginx</option>
              <option value="php">PHP</option>
              <option value="js">JavaScript (Client-side)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Redirect Type</label>
            <select id="redirect-type" class="form-input">
              <option value="301">301 (Permanent)</option>
              <option value="302">302 (Temporary)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Old URL / Path</label>
            <input type="text" id="old-url" class="form-input" placeholder="/old-page.html">
          </div>
          
          <div class="form-group">
            <label>New URL / Destination</label>
            <input type="url" id="new-url" class="form-input" placeholder="https://example.com/new-page">
          </div>
          
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Generated Code</label>
          <div id="output-code" class="output-box"></div>
          <button class="btn btn-primary" id="btn-copy" style="justify-content: center;">
            Copy Code
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
