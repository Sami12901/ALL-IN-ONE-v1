<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Generator - ALL IN ONE</title>
  <meta name="description" content="Auto-generate a professional resume from your basic details using a simple step-by-step wizard.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <script type="module" src="../../js/components.js"></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Roboto:wght@300;400;500;700&family=Lora:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Reuse templates from CV Builder Pro -->
  <script src="../professional-cv-builder-pro/templates.js"></script>

  <style>
    .wizard-container {
      max-width: 800px;
      margin: 2rem auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .wizard-header {
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, rgba(79,70,229,0.1), rgba(168,85,247,0.05));
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .wizard-header h2 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--text-primary);
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
    }

    .step-indicator {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .step-indicator:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 60%;
      width: 80%;
      height: 2px;
      background: var(--border);
      z-index: 1;
    }

    .step-indicator.active:not(:last-child)::after,
    .step-indicator.completed:not(:last-child)::after {
      background: var(--accent);
    }

    .step-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-secondary);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.5rem;
      font-weight: bold;
      color: var(--text-secondary);
      position: relative;
      z-index: 2;
    }

    .step-indicator.active .step-num {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .step-indicator.completed .step-num {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .step-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .step-indicator.active .step-label {
      color: var(--accent);
      font-weight: 600;
    }

    .wizard-body {
      padding: 2rem;
      min-height: 350px;
    }

    .wizard-step-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .wizard-step-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary); font-family: inherit; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none; border-color: var(--accent);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .wizard-footer {
      padding: 1.5rem 2rem;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .btn {
      padding: 0.6rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .btn-prev {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-prev:hover { background: var(--border); }

    .btn-next {
      background: var(--accent);
      color: #fff;
    }

    .btn-next:hover { opacity: 0.9; transform: translateY(-1px); }

    .dynamic-list { margin-top: 1rem; }
    .list-item { background: var(--bg-primary); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; position: relative; }
    .list-item .remove-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: rgba(239,68,68,0.1); color: #ef4444; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .list-item .remove-btn:hover { background: #ef4444; color: #fff; }
    .add-btn { width: 100%; padding: 0.75rem; border: 2px dashed var(--border); background: transparent; color: var(--accent); border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 1rem; }
    .add-btn:hover { border-color: var(--accent); background: rgba(79,70,229,0.05); }

    /* Final Preview Area */
    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #e5e7eb;
      padding: 2rem;
      border-radius: 8px;
      overflow-x: auto;
    }
    [data-theme="dark"] .preview-area { background: #1a1a2e; }

    .cv-paper {
      width: 210mm;
      min-height: 297mm;
      background: #fff;
      color: #1f2937;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      font-family: 'Inter', sans-serif;
      font-size: 10pt;
      line-height: 1.5;
      position: relative;
      overflow: hidden;
      transform-origin: top center;
      transform: scale(0.6);
      margin-bottom: -100mm; /* compensate for scale */
    }

    /* Include dynamic styles via JS like CV Builder Pro */
  </style>
</head>
<body>
  <app-header></app-header>

  <main class="container">
    <div class="wizard-container">
      <div class="wizard-header">
        <h2>⚡ Auto Resume Generator</h2>
      </div>

      <div class="progress-bar" id="progress-bar">
        <div class="step-indicator active" data-step="1">
          <div class="step-num">1</div>
          <div class="step-label">Personal</div>
        </div>
        <div class="step-indicator" data-step="2">
          <div class="step-num">2</div>
          <div class="step-label">Summary</div>
        </div>
        <div class="step-indicator" data-step="3">
          <div class="step-num">3</div>
          <div class="step-label">Experience</div>
        </div>
        <div class="step-indicator" data-step="4">
          <div class="step-num">4</div>
          <div class="step-label">Education</div>
        </div>
        <div class="step-indicator" data-step="5">
          <div class="step-num">5</div>
          <div class="step-label">Finish</div>
        </div>
      </div>

      <div class="wizard-body">
        <!-- Step 1: Personal -->
        <div class="wizard-step-content active" id="step-1">
          <div class="form-row">
            <div class="form-group"><label>First Name</label><input type="text" id="firstName" placeholder="John"></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="lastName" placeholder="Doe"></div>
          </div>
          <div class="form-group"><label>Job Title</label><input type="text" id="jobTitle" placeholder="e.g. Software Engineer"></div>
          <div class="form-row">
            <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="john@example.com"></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="phone" placeholder="+1 234 567 890"></div>
          </div>
          <div class="form-group"><label>Location / Address</label><input type="text" id="address" placeholder="City, Country"></div>
        </div>

        <!-- Step 2: Summary & Skills -->
        <div class="wizard-step-content" id="step-2">
          <div class="form-group">
            <label>Professional Summary</label>
            <textarea id="summary" rows="5" placeholder="A brief summary of your professional background..."></textarea>
          </div>
          <div class="form-group">
            <label>Key Skills (comma separated)</label>
            <textarea id="skills" rows="3" placeholder="e.g. JavaScript, Project Management, Team Leadership"></textarea>
          </div>
        </div>

        <!-- Step 3: Experience -->
        <div class="wizard-step-content" id="step-3">
          <button class="add-btn" onclick="addExperience()">+ Add Work Experience</button>
          <div class="dynamic-list" id="exp-list"></div>
        </div>

        <!-- Step 4: Education -->
        <div class="wizard-step-content" id="step-4">
          <button class="add-btn" onclick="addEducation()">+ Add Education</button>
          <div class="dynamic-list" id="edu-list"></div>
        </div>

        <!-- Step 5: Finish & Preview -->
        <div class="wizard-step-content" id="step-5">
          <div class="form-row" style="margin-bottom: 1.5rem;">
            <div class="form-group">
              <label>Select Template</label>
              <select id="template-select"></select>
            </div>
            <div class="form-group">
              <label>Accent Color</label>
              <input type="color" id="accent-color" value="#4f46e5" style="width:100%; height: 42px; border:none; padding:0; border-radius:8px; cursor:pointer;">
            </div>
          </div>
          
          <div class="preview-area">
            <div class="cv-paper" id="cv-paper">
              <!-- Rendered CV -->
            </div>
          </div>
        </div>

      </div>

      <div class="wizard-footer">
        <button class="btn btn-prev" id="btn-prev" style="display: none;">Back</button>
        <button class="btn btn-next" id="btn-next">Next Step</button>
        <button class="btn btn-next" id="btn-export" style="display: none; background: var(--success);">Export PDF</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
