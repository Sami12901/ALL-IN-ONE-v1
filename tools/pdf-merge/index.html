<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Merge - ALL IN ONE</title>
  <meta name="description" content="Combine multiple PDF files and images into a single document instantly and securely.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <!-- PDF-lib for merging PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    .merge-layout {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .upload-zone {
      border: 2px dashed var(--stroke);
      border-radius: 1rem;
      padding: 3rem 2rem;
      text-align: center;
      background: rgba(0,0,0,0.2);
      transition: all 0.2s;
      cursor: pointer;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb), 0.05);
    }
    
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--stroke);
      padding: 1rem;
      border-radius: 0.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: grab;
    }
    .file-item:active { cursor: grabbing; }
    .file-item.dragging { opacity: 0.5; }
    
    .drag-handle {
      color: var(--muted);
      cursor: grab;
      display: flex;
      align-items: center;
    }
    
    .file-icon {
      color: #ef4444; /* PDF Red */
      display: flex;
      align-items: center;
    }
    
    .file-details { flex-grow: 1; overflow: hidden; }
    .file-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .file-size { font-size: 0.8rem; color: var(--muted); }
    
    .remove-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 0.25rem;
      transition: color 0.2s;
    }
    .remove-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--stroke);
    }
  </style>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>PDF Merge</h1>
        <p class="tool-description">Combine multiple PDFs into a single file. Drag and drop to rearrange order. Processing happens entirely on your device.</p>
      </div>

      <div class="tool-panel glass-panel merge-layout">
        
        <div class="upload-zone" id="upload-zone">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1" fill="none" style="margin-bottom: 1rem; color: var(--muted);">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <h3 style="margin-bottom: 0.5rem;">Drag & Drop PDF files here</h3>
          <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">or click to browse from your computer</p>
          <button class="btn btn-secondary" id="btn-browse" style="margin: 0 auto;">Select Files</button>
          <input type="file" id="file-input" accept="application/pdf, image/jpeg, image/png" multiple style="display: none;">
        </div>
        
        <div id="file-list-container" style="display: none;">
          <h4 style="margin-bottom: 1rem; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;">Selected Files</h4>
          <div class="file-list" id="file-list">
            <!-- File items injected here -->
          </div>
          
          <div class="action-bar" style="margin-top: 1.5rem;">
            <div style="font-size: 0.85rem; color: var(--muted);">
              <span id="file-count">0 files</span> selected
            </div>
            <button class="btn btn-primary" id="btn-merge" style="padding: 0.75rem 2rem;">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><circle cx="12" cy="14" r="3"></circle><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
              Merge & Download
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
