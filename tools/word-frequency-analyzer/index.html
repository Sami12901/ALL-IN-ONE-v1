<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Frequency Analyzer - ALL IN ONE</title>
  <meta name="description" content="Analyze your text to see which words you use the most.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .results-box {
      background: rgba(15,15,15,0.4); border: 1px solid var(--stroke); border-radius: 0.5rem;
      height: 400px; overflow-y: auto; padding: 0.5rem;
    }
    .freq-item {
      display: flex; justify-content: space-between; padding: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;
    }
    .freq-item:last-child { border-bottom: none; }
    .freq-word { font-weight: 600; color: var(--accent); }
    .freq-count { background: var(--surface); padding: 0.1rem 0.5rem; border-radius: 99px; font-size: 0.8rem; }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Word Frequency Analyzer</h1>
        <p class="tool-description">Find out the most common words used in any block of text.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Input Text</label>
          <textarea id="input-text" class="form-textarea" style="height: 400px;" placeholder="Paste an article, essay, or any text here..."></textarea>
          <div class="toolbar">
            <span class="text-xs text-muted" id="word-count">0 total words</span>
            <button class="btn btn-secondary btn-sm" id="btn-clear">Clear</button>
          </div>
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Frequency Results</label>
          <div class="results-box" id="results-box">
            <div style="padding: 1rem; text-align: center; color: var(--muted); font-size: 0.85rem;">Results will appear here</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
