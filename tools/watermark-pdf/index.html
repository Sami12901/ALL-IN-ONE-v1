<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watermark PDF - Add Text or Image Watermarks Online - ALL IN ONE</title>
  <meta name="description" content="Add a text or image watermark to your PDF files. Adjust opacity, position, and rotation. 100% offline and secure.">
  <meta name="keywords" content="watermark pdf, add watermark to pdf, pdf watermark offline, free pdf tools">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/watermark-pdf/">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
  <script type="module" src="../../js/main.js" defer></script>
  
  <!-- PDF-lib for manipulation -->
  <script src="../../assets/lib/pdf-lib.min.js"></script>

  <style>
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 3rem 1.5rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      background: var(--bg-secondary);
      position: relative;
    }
    
    .upload-area:hover, .upload-area.drag-over {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    
    .file-info {
      margin-top: 1.5rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    
    .options-grid {
      display: none;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    @media (min-width: 768px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .form-control {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      width: 100%;
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    .radio-group {
      display: flex;
      gap: 1rem;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      cursor: pointer;
      font-weight: normal;
      color: var(--text-primary);
    }
    
    .actions-panel {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      display: none;
      justify-content: flex-end;
    }
    
    .progress-container {
      display: none;
      margin-top: 1.5rem;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .progress-bar {
      height: 8px;
      background: var(--bg-primary);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    
    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      width: 0%;
      transition: width 0.3s ease;
    }

    .image-preview {
      width: 100%;
      height: 100px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .grid-pos {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
    }

    .pos-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pos-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pos-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center;">
        <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">Watermark PDF</h1>
        <p class="tool-description">Stamp an image or text over your PDF. 100% Secure & Client-Side.</p>
      </div>

      <div class="glass-panel" style="padding: 2rem; max-width: 900px; margin: 0 auto;">
        
        <!-- Upload Area -->
        <div class="upload-area" id="drop-zone">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
          </svg>
          <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--text-primary);">Drag & Drop PDF Here</h3>
          <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">or click to browse from your device</p>
          <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">
            Choose PDF File
          </button>
          <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        </div>

        <!-- File Info -->
        <div class="file-info" id="file-info">
          <div>
            <div style="font-weight: 600" id="file-name">document.pdf</div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);" id="file-size">0 MB</div>
          </div>
          <button class="btn btn-secondary btn-sm" id="clear-btn">Clear / New File</button>
        </div>

        <!-- Watermark Options -->
        <div class="options-grid" id="options-grid">
          
          <!-- Content Type -->
          <div class="option-card">
            <div class="option-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              Watermark Content
            </div>
            
            <div class="form-group">
              <div class="radio-group" style="margin-bottom: 0.5rem;">
                <label><input type="radio" name="wm-type" value="text" checked> Text</label>
                <label><input type="radio" name="wm-type" value="image"> Image</label>
              </div>
            </div>

            <!-- Text Config -->
            <div id="text-config" style="display: flex; flex-direction: column; gap: 1rem;">
              <div class="form-group">
                <label>Text Content</label>
                <input type="text" id="wm-text" class="form-control" placeholder="CONFIDENTIAL" value="CONFIDENTIAL">
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label>Font Size</label>
                  <input type="number" id="wm-size" class="form-control" value="48" min="10" max="200">
                </div>
                <div class="form-group">
                  <label>Color</label>
                  <input type="color" id="wm-color" class="form-control" style="padding: 0; height: 42px;" value="#ff0000">
                </div>
              </div>
            </div>

            <!-- Image Config -->
            <div id="image-config" style="display: none; flex-direction: column; gap: 1rem;">
              <div class="form-group">
                <label>Select Image (PNG/JPG)</label>
                <button class="btn btn-secondary" onclick="document.getElementById('image-input').click()" style="width: 100%;">
                  Browse Image
                </button>
                <input type="file" id="image-input" accept="image/png, image/jpeg" style="display: none;">
                <div class="image-preview" id="image-preview">
                  <span style="color: var(--text-tertiary); font-size: 0.8rem;">No image selected</span>
                </div>
              </div>
              <div class="form-group">
                <label>Scale (%)</label>
                <input type="number" id="wm-img-scale" class="form-control" value="50" min="10" max="200">
              </div>
            </div>

          </div>

          <!-- Position & Style -->
          <div class="option-card">
            <div class="option-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
              Placement & Style
            </div>

            <div class="form-group">
              <label>Position</label>
              <div class="grid-pos">
                <button class="pos-btn" data-pos="top-left">Top Left</button>
                <button class="pos-btn" data-pos="top-center">Top Center</button>
                <button class="pos-btn" data-pos="top-right">Top Right</button>
                <button class="pos-btn" data-pos="middle-left">Middle Left</button>
                <button class="pos-btn active" data-pos="center">Center</button>
                <button class="pos-btn" data-pos="middle-right">Middle Right</button>
                <button class="pos-btn" data-pos="bottom-left">Bottom Left</button>
                <button class="pos-btn" data-pos="bottom-center">Bottom Center</button>
                <button class="pos-btn" data-pos="bottom-right">Bottom Right</button>
              </div>
              <input type="hidden" id="wm-position" value="center">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem;">
              <div class="form-group">
                <label>Opacity (%)</label>
                <input type="range" id="wm-opacity" min="5" max="100" value="50" style="width: 100%; margin-top: 0.5rem;">
                <div style="text-align: right; font-size: 0.8rem; color: var(--text-secondary);" id="opacity-val">50%</div>
              </div>
              <div class="form-group">
                <label>Rotation (deg)</label>
                <input type="number" id="wm-rotation" class="form-control" value="45" min="-360" max="360">
              </div>
            </div>

          </div>

        </div>

        <!-- Progress (Loading) -->
        <div class="progress-container" id="loading-container">
          <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary);">
            <span id="loading-text">Applying watermark...</span>
            <span id="loading-percent">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="loading-fill"></div>
          </div>
        </div>

        <!-- Actions -->
        <div class="actions-panel" id="actions-panel">
          <button class="btn btn-primary" id="save-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Apply & Download PDF
          </button>
        </div>

      </div>
    </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
