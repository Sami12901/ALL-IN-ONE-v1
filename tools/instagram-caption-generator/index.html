<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Caption Generator - ALL IN ONE</title>
  <meta name="description" content="Generate engaging, personalized Instagram captions for your posts instantly.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="../../js/main.js" defer></script>
</head>
<body>
  <app-header></app-header>
  
  <main class="workspace-container">
    <app-breadcrumb tool-name="Instagram Caption Generator"></app-breadcrumb>

    <div class="workspace-grid">
      <!-- Input Section -->
      <div class="workspace-panel input-panel glass-panel">
        <h2 class="panel-title">Post Details</h2>
        
        <div class="form-group">
          <label>What's your post about? <span class="required">*</span></label>
          <textarea id="topic" rows="3" class="input-element" placeholder="e.g. A beautiful sunset at the beach with friends..." required></textarea>
        </div>
        
        <div class="form-group">
          <label>Tone</label>
          <select id="tone" class="input-element">
            <option value="casual">Casual / Friendly</option>
            <option value="funny">Funny / Humorous</option>
            <option value="inspirational">Inspirational / Motivational</option>
            <option value="professional">Professional / Business</option>
            <option value="short">Short / Minimalist</option>
            <option value="questions">Engaging / Ask a Question</option>
          </select>
        </div>
        
        <div class="form-group" style="display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <label>Include Emojis?</label>
            <select id="emojis" class="input-element">
              <option value="yes">Yes, lots of emojis ✨</option>
              <option value="few">Just a few 👍</option>
              <option value="no">No emojis</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label>Include Hashtags?</label>
            <select id="hashtags" class="input-element">
              <option value="yes">Yes, include hashtags</option>
              <option value="no">No hashtags</option>
            </select>
          </div>
        </div>
        
        <button id="generate-btn" class="action-btn primary-btn" style="width: 100%; margin-top: 1rem;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
          Generate Captions
        </button>
      </div>

      <!-- Output Section -->
      <div class="workspace-panel output-panel glass-panel" style="display: flex; flex-direction: column;">
        <h2 class="panel-title" style="display: flex; justify-content: space-between; align-items: center;">
          Generated Captions
        </h2>
        
        <div id="results-container" style="display: flex; flex-direction: column; gap: 1.5rem; flex: 1; overflow-y: auto;">
          <div style="color: var(--text-tertiary); text-align: center; margin-top: 2rem;">
            Fill out the details on the left and click "Generate Captions" to see results here.
          </div>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
