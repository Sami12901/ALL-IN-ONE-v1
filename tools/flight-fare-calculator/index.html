<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Fare Calculator - ALL IN ONE</title>
  <meta name="description" content="Calculate total flight ticket costs including base fare, taxes, agency commission, and discounts.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="../../js/main.js" defer></script>
</head>
<body>
  <app-header></app-header>
  
  <main class="tool-layout">
    <div class="container tool-container">
    <app-breadcrumbs></app-breadcrumbs>
      <div class="tool-header">
        <h1>Flight Fare Calculator</h1>
      </div>

    <div class="tool-workarea split-view" style="grid-template-columns: 1fr 1fr;">
      
      <!-- Input Panel -->
      <div class="tool-panel glass-panel">
        <h2 class="panel-title">Ticket Details</h2>
        
        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label>Adults (12+ yrs)</label>
            <input type="number" id="adult-count" class="form-input" value="1" min="1">
          </div>
          <div>
            <label>Children (2-11 yrs)</label>
            <input type="number" id="child-count" class="form-input" value="0" min="0">
          </div>
          <div>
            <label>Infants (Under 2)</label>
            <input type="number" id="infant-count" class="form-input" value="0" min="0">
          </div>
        </div>

        <h2 class="panel-title" style="margin-top: 1.5rem;">Fare Components (Per Adult)</h2>

        <div class="form-group">
          <label>Base Fare (Adult)</label>
          <input type="number" id="base-fare" class="form-input" value="35000" min="0">
        </div>
        
        <div class="form-group">
          <label>Airline Taxes & Surcharges (Adult)</label>
          <input type="number" id="airline-taxes" class="form-input" value="15000" min="0">
        </div>

        <h2 class="panel-title" style="margin-top: 1.5rem;">Agency Fees & Discounts</h2>

        <div class="form-group">
          <label>Agency Commission / Service Charge (%)</label>
          <input type="number" id="agency-comm" class="form-input" value="5" min="0" max="100">
        </div>

        <div class="form-group">
          <label>Discount to Customer (Total Flat Amount)</label>
          <input type="number" id="customer-discount" class="form-input" value="0" min="0">
        </div>

        <button id="calculate-btn" class="action-btn primary-btn" style="width: 100%; margin-top: 1rem;">
          Calculate Total Fare
        </button>
      </div>

      <!-- Output Panel -->
      <div class="tool-panel glass-panel" style="display: flex; flex-direction: column;">
        <h2 class="panel-title">Fare Breakdown</h2>
        
        <div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); padding: 2rem; border-radius: var(--radius-lg); text-align: center; margin-bottom: 2rem;">
          <div style="font-size: 1rem; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Final Payable Amount</div>
          <div id="res-total" style="font-size: 3.5rem; font-weight: 800; color: #3b82f6; font-family: var(--font-display);">0</div>
        </div>

        <div style="flex: 1;">
          <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">Detailed Summary</h3>
          <ul id="breakdown-list" style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); line-height: 2; font-size: 0.95rem;">
            <!-- Rendered via JS -->
          </ul>
        </div>

        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
          <div style="color: var(--text-tertiary); font-size: 0.85rem;">*Child fare calculated as 75% of Base Fare.<br>*Infant fare calculated as 10% of Base Fare.</div>
        </div>

      </div>

    </div>
  </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
