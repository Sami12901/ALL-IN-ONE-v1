<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Robots.txt Generator</h1>
        <p class="tool-description">Easily create search engine crawler rules for your website.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          
          <div class="form-group">
            <label>Default Rule for all Robots</label>
            <select id="default-rule" class="form-input">
              <option value="allow">Allow All (Recommended)</option>
              <option value="disallow">Disallow All</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Crawl-Delay (Seconds, optional)</label>
            <input type="number" id="crawl-delay" class="form-input" placeholder="e.g. 10" min="1">
          </div>
          
          <div class="form-group">
            <label>Sitemap URL (Optional)</label>
            <input type="url" id="sitemap-url" class="form-input" placeholder="https://example.com/sitemap.xml">
          </div>
          
          <div class="form-group">
            <label>Disallowed Directories (One per line)</label>
            <textarea id="disallowed-dirs" class="form-textarea" rows="4" placeholder="/cgi-bin/\n/admin/\n/private/"></textarea>
          </div>
          
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Generated robots.txt</label>
          <div id="output-code" class="output-box"></div>
          <button class="btn btn-primary" id="btn-copy" style="justify-content: center;">
            Copy robots.txt
          </button>
        </div>
      </div>
    </div>
  </main>
