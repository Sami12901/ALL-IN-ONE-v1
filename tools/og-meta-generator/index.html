<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Graph Meta Generator - ALL IN ONE</title>
  <meta name="description" content="Generate social media preview tags for Facebook, Twitter, and LinkedIn.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    
    .social-preview {
      border: 1px solid var(--stroke);
      border-radius: 0.5rem;
      overflow: hidden;
      margin-bottom: 1rem;
      background: var(--surface);
    }
    .preview-img { width: 100%; height: 200px; background: #333; object-fit: cover; }
    .preview-content { padding: 1rem; }
    .preview-domain { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin-bottom: 0.25rem; }
    .preview-title { font-weight: bold; font-size: 1rem; margin-bottom: 0.25rem; color: var(--text); }
    .preview-desc { font-size: 0.85rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .output-box {
      background: rgba(0,0,0,0.5); border: 1px solid var(--stroke); border-radius: 0.5rem;
      padding: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem; color: #a78bfa;
      white-space: pre-wrap; word-break: break-all; min-height: 250px;
    }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Open Graph Meta Generator</h1>
        <p class="tool-description">Generate exact meta tags to control how your links look on social media.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="og-title" class="form-input" placeholder="Catchy Article Title">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="og-desc" class="form-textarea" rows="3" placeholder="A brief summary of your awesome content..."></textarea>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" id="og-image" class="form-input" placeholder="https://example.com/banner.jpg">
          </div>
          <div class="form-group">
            <label>Page URL</label>
            <input type="url" id="og-url" class="form-input" placeholder="https://example.com/article">
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="og-type" class="form-input">
              <option value="website">Website</option>
              <option value="article">Article</option>
              <option value="profile">Profile</option>
            </select>
          </div>
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Live Preview (Facebook/LinkedIn style)</label>
          <div class="social-preview">
            <img src="" id="prev-img" class="preview-img" alt="Preview Image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM4ODgiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5ObyBJbWFnZTwvdGV4dD48L3N2Zz4='">
            <div class="preview-content">
              <div class="preview-domain" id="prev-domain">EXAMPLE.COM</div>
              <div class="preview-title" id="prev-title">Catchy Article Title</div>
              <div class="preview-desc" id="prev-desc">A brief summary of your awesome content...</div>
            </div>
          </div>

          <label style="font-weight: 600; font-size: 0.9rem; margin-top: 1rem;">Generated Tags</label>
          <div id="output-code" class="output-box"></div>
          <button class="btn btn-primary" id="btn-copy" style="justify-content: center;">
            Copy Tags
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
