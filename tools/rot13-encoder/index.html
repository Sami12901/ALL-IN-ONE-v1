<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROT13 Encoder/Decoder - ALL IN ONE</title>
  <meta name="description" content="Instantly encode or decode text using the classic ROT13 cipher.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .split-layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>ROT13 Encoder/Decoder</h1>
        <p class="tool-description">Because ROT13 shifts exactly 13 letters, encoding and decoding use the exact same process!</p>
      </div>

      <div class="tool-panel glass-panel">
        <div class="split-layout">
          <div class="panel">
            <label style="font-weight: 600; font-size: 0.9rem;">Input Text</label>
            <textarea id="input-text" class="form-textarea" rows="8" placeholder="Type text to encode or decode..."></textarea>
            <div class="toolbar">
              <button class="btn btn-secondary btn-sm" id="btn-clear">Clear</button>
            </div>
          </div>

          <div class="panel">
            <label style="font-weight: 600; font-size: 0.9rem;">ROT13 Result</label>
            <textarea id="output-text" class="form-textarea" rows="8" placeholder="Result will appear here..." readonly></textarea>
            <div class="toolbar">
              <span></span>
              <button class="btn btn-primary btn-sm" id="btn-copy">Copy Result</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
