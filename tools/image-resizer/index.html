<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer & Compressor - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Resize and compress images to WebP/PNG/JPG.">
  <meta name="keywords" content="resize, compress, webp, quality, dimensions, free, online, tool, utility">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/image-resizer/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
  <script type="module" src="../../js/main.js" defer></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Image Resizer & Compressor</h1>
        <p class="tool-description">Resize and compress images to WebP/PNG/JPG.</p>
      </div>

      <!-- Tool Workspace -->
      <div class="tool-workspace">
        <div class="input-panel glass-panel">
          <div class="form-group">
            <label for="image-upload" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Select Image</label>
            <input type="file" id="image-upload" accept="image/png, image/jpeg, image/webp" style="width: 100%; padding: 1rem; border: 2px dashed var(--border); border-radius: var(--radius-md); background: var(--bg-tertiary); cursor: pointer; color: var(--text-primary);">
            <div id="file-info" style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); display: none;"></div>
          </div>
          
          <div class="form-group" style="margin-top: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
              <label for="resize-width" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Width (px)</label>
              <input type="number" id="resize-width" class="form-control" placeholder="Auto" min="1">
            </div>
            <div>
              <label for="resize-height" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Height (px)</label>
              <input type="number" id="resize-height" class="form-control" placeholder="Auto" min="1">
            </div>
          </div>
          
          <div class="form-group" style="margin-top: 1rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.9rem;">
              <input type="checkbox" id="maintain-aspect-ratio" checked>
              Maintain Aspect Ratio
            </label>
          </div>

          <div class="form-group" style="margin-top: 1.5rem;">
            <label for="output-format" style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Output Format</label>
            <select id="output-format" class="form-control">
              <option value="image/jpeg">JPEG</option>
              <option value="image/png">PNG</option>
              <option value="image/webp" selected>WebP (Best Compression)</option>
            </select>
          </div>
          
          <div class="form-group" style="margin-top: 1.5rem;">
            <label for="quality-slider" style="display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 0.5rem;">
              <span>Quality (Compression)</span>
              <span id="quality-value">80%</span>
            </label>
            <input type="range" id="quality-slider" min="1" max="100" value="80" style="width: 100%;">
            <p style="font-size: 0.8rem; color: var(--text-tertiary); margin-top: 0.25rem;">Lower quality reduces file size.</p>
          </div>

          <button id="process-btn" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" disabled>Process Image</button>
        </div>

        <div class="output-panel glass-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-weight: 600; font-size: 1.1rem;">Preview</h3>
            <button id="download-btn" class="btn btn-secondary" disabled>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 0.25rem;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Download
            </button>
          </div>
          <div id="preview-container" style="width: 100%; min-height: 250px; background: var(--bg-tertiary); border-radius: var(--radius-md); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
            <span id="preview-placeholder" style="color: var(--text-tertiary); font-size: 0.9rem;">Upload an image to see preview</span>
            <img id="image-preview" style="max-width: 100%; max-height: 400px; display: none; object-fit: contain;">
          </div>
          <div id="output-info" style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary); display: none; background: rgba(16, 185, 129, 0.1); padding: 0.75rem; border-radius: var(--radius-sm); border: 1px solid rgba(16, 185, 129, 0.2);">
            <strong>Success!</strong> Dimensions: <span id="out-dim"></span> | Size: <span id="out-size"></span> (<span id="out-savings" style="color: var(--success); font-weight: bold;"></span>)
          </div>
        </div>
      </div>
    
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <!-- Structured schema for search engine rich snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Image Resizer & Compressor",
    "url": "https://sami12901.github.io/ALL-IN-ONE-v1/tools/image-resizer/",
    "description": "Resize and compress images to WebP/PNG/JPG.",
    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>
</body>
</html>
