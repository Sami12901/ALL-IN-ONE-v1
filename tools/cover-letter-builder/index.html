<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <meta name="description" content="Generate bespoke, tailored cover letters with custom tones (Professional, Enthusiastic, Confident) and dynamic achievement paragraphs.">
  <meta name="keywords" content="cv, resume, job, career, cover letter builder, free, online, tool, utility, letter generator">

  <meta property="og:image:secure_url" content="https://sami12901.github.io/ALL-IN-ONE-v1/assets/icons/icon-512.png">

  <meta name="twitter:description" content="Generate bespoke, tailored cover letters with custom tones (Professional, Enthusiastic, Confident) and dynamic achievement paragraphs.">
  <meta name="twitter:image" content="https://sami12901.github.io/ALL-IN-ONE-v1/assets/icons/icon-512.png">
  <meta name="twitter:image:alt" content="Cover Letter Builder - ALL IN ONE">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>

  <style>
    /* Cover Letter Builder Custom Styling */
    .letter-workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (min-width: 1080px) {
      .letter-workspace {
        grid-template-columns: 480px 1fr;
      }
    }
    @media (min-width: 1320px) {
      .letter-workspace {
        grid-template-columns: 520px 1fr;
      }
    }

    /* Tone Selector */
    .tone-selector-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .tone-pill {
      flex: 1;
      min-width: 100px;
      text-align: center;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      align-items: center;
    }
    .tone-pill:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }
    .tone-pill.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* Paragraph Accordion Items */
    .paragraph-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .preset-selector-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    /* Stationery Paper Preview */
    .stationery-outer {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    @media (max-width: 768px) {
      .stationery-outer {
        padding: 0.5rem;
      }
    }

    .letter-paper {
      width: 100%;
      max-width: 800px;
      min-height: 1000px;
      background: #ffffff;
      color: #1f2937;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      border-radius: 4px;
      padding: 3.5rem 4rem;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.7;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      position: relative;
    }
    @media (max-width: 600px) {
      .letter-paper {
        padding: 2rem 1.5rem;
        font-size: 13px;
        line-height: 1.6;
      }
    }

    .letter-header {
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 1.5rem;
    }
    .letter-sender-name {
      font-family: var(--font-display), Georgia, serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .letter-sender-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 0.5rem;
    }

    .letter-meta {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.9rem;
      color: #4b5563;
    }

    .letter-salutation {
      font-weight: 600;
      color: #111827;
      font-size: 0.95rem;
    }

    .letter-body {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      color: #374151;
      text-align: justify;
    }
    .letter-body p {
      margin: 0;
    }

    .letter-signoff {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .signature-typed {
      font-family: var(--font-display), Georgia, serif;
      font-size: 1.5rem;
      color: #111827;
      margin-top: 0.75rem;
    }

    /* Print styles */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      app-header, app-breadcrumbs, app-footer, .tool-header, .editor-column, .hide-print {
        display: none !important;
      }
      .tool-layout, .container, .letter-workspace, .stationery-outer {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      .letter-paper {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: 100% !important;
        min-height: auto !important;
      }
      @page {
        margin: 2cm;
        size: A4 portrait;
      }
    }
  </style>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">Cover Letter Builder Studio</h1>
            <p class="tool-description">Tailor high-impact cover letters with customizable tones, metric-driven hooks, and live executive stationery preview.</p>
          </div>
          <div class="action-bar" style="margin-top: 0;">
            <button id="btn-load-sample" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              Load Sample Data
            </button>
            <button id="btn-reset" class="btn btn-secondary" style="color: var(--error);">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
              Reset
            </button>
            <button id="btn-print" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
              Print / Save PDF
            </button>
          </div>
        </div>
      </div>

      <div class="letter-workspace">
        
        <!-- Left: Studio Controls -->
        <div class="tool-panel glass-panel editor-column" style="display: flex; flex-direction: column; gap: 1.5rem;">
          
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="panel-title" style="margin-bottom: 0; border: none; padding: 0;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              Letter Parameters
            </h2>
            <span style="font-size: 0.75rem; color: var(--text-tertiary);" id="autosave-label">Live auto-synced</span>
          </div>

          <!-- 1. Tone Selector -->
          <div class="form-group">
            <label>Tone of Voice</label>
            <div class="tone-selector-group">
              <button type="button" class="tone-pill active" data-tone="professional">
                <span>Professional</span>
                <span style="font-size: 0.7rem; opacity: 0.7;">Poised &amp; Corporate</span>
              </button>
              <button type="button" class="tone-pill" data-tone="enthusiastic">
                <span>Enthusiastic</span>
                <span style="font-size: 0.7rem; opacity: 0.7;">Passionate &amp; Driven</span>
              </button>
              <button type="button" class="tone-pill" data-tone="confident">
                <span>Confident</span>
                <span style="font-size: 0.7rem; opacity: 0.7;">Bold &amp; Impact-led</span>
              </button>
            </div>
          </div>

          <!-- 2. Applicant Info -->
          <div style="border-top: 1px solid var(--border); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Applicant Information</span>
            <div class="grid-2">
              <div class="form-group">
                <label for="inp-name" style="font-size: 0.75rem;">Full Name *</label>
                <input type="text" id="inp-name" class="form-input" placeholder="e.g. Maya Lin">
              </div>
              <div class="form-group">
                <label for="inp-email" style="font-size: 0.75rem;">Email Address</label>
                <input type="email" id="inp-email" class="form-input" placeholder="maya.lin@example.com">
              </div>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label for="inp-phone" style="font-size: 0.75rem;">Phone Number</label>
                <input type="tel" id="inp-phone" class="form-input" placeholder="+1 (555) 789-0123">
              </div>
              <div class="form-group">
                <label for="inp-location" style="font-size: 0.75rem;">City, State / Country</label>
                <input type="text" id="inp-location" class="form-input" placeholder="Seattle, WA">
              </div>
            </div>
          </div>

          <!-- 3. Company & Role Info -->
          <div style="border-top: 1px solid var(--border); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Target Role &amp; Employer</span>
            <div class="grid-2">
              <div class="form-group">
                <label for="inp-role" style="font-size: 0.75rem;">Target Job Title *</label>
                <input type="text" id="inp-role" class="form-input" placeholder="e.g. Principal Product Designer">
              </div>
              <div class="form-group">
                <label for="inp-company" style="font-size: 0.75rem;">Company Name *</label>
                <input type="text" id="inp-company" class="form-input" placeholder="e.g. Stripe">
              </div>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label for="inp-manager" style="font-size: 0.75rem;">Hiring Manager (or Team)</label>
                <input type="text" id="inp-manager" class="form-input" placeholder="e.g. Sarah Lin or Hiring Team">
              </div>
              <div class="form-group">
                <label for="inp-company-loc" style="font-size: 0.75rem;">Company Location / Dept</label>
                <input type="text" id="inp-company-loc" class="form-input" placeholder="San Francisco, CA">
              </div>
            </div>
            <div class="form-group">
              <label for="inp-qualifications" style="font-size: 0.75rem;">Key Qualifications &amp; Proof Points</label>
              <input type="text" id="inp-qualifications" class="form-input" placeholder="e.g. 10+ yrs design leadership, 42% conversion uplift, design system scale">
            </div>
          </div>

          <!-- 4. Paragraph Templates Accordion -->
          <div style="border-top: 1px solid var(--border); padding-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Paragraph Templates</span>
              <button id="btn-remix-all" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;">
                ↻ Remix All
              </button>
            </div>

            <!-- Paragraph 1: Opening Hook -->
            <div class="paragraph-card">
              <div class="preset-selector-row">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary);">1. Opening Hook</label>
                <select id="sel-p1-variant" class="form-select" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; width: auto;">
                  <option value="0">Variant A</option>
                  <option value="1">Variant B</option>
                  <option value="2">Variant C</option>
                </select>
              </div>
              <textarea id="txt-p1" class="form-textarea" style="min-height: 80px; font-size: 0.85rem;"></textarea>
            </div>

            <!-- Paragraph 2: Core Achievements -->
            <div class="paragraph-card">
              <div class="preset-selector-row">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary);">2. Core Achievements</label>
                <select id="sel-p2-variant" class="form-select" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; width: auto;">
                  <option value="0">Variant A</option>
                  <option value="1">Variant B</option>
                  <option value="2">Variant C</option>
                </select>
              </div>
              <textarea id="txt-p2" class="form-textarea" style="min-height: 90px; font-size: 0.85rem;"></textarea>
            </div>

            <!-- Paragraph 3: Value Proposition -->
            <div class="paragraph-card">
              <div class="preset-selector-row">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary);">3. Value Proposition</label>
                <select id="sel-p3-variant" class="form-select" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; width: auto;">
                  <option value="0">Variant A</option>
                  <option value="1">Variant B</option>
                  <option value="2">Variant C</option>
                </select>
              </div>
              <textarea id="txt-p3" class="form-textarea" style="min-height: 80px; font-size: 0.85rem;"></textarea>
            </div>

            <!-- Paragraph 4: Call to Action -->
            <div class="paragraph-card">
              <div class="preset-selector-row">
                <label style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary);">4. Call to Action &amp; Closing</label>
                <select id="sel-p4-variant" class="form-select" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; width: auto;">
                  <option value="0">Variant A</option>
                  <option value="1">Variant B</option>
                  <option value="2">Variant C</option>
                </select>
              </div>
              <textarea id="txt-p4" class="form-textarea" style="min-height: 70px; font-size: 0.85rem;"></textarea>
            </div>
          </div>

        </div>

        <!-- Right: Live Stationery Preview -->
        <div class="preview-column">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: var(--bg-secondary); border: 1px solid var(--border); padding: 0.75rem 1.25rem; border-radius: var(--radius-md);" class="hide-print">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Document Preview</span>
            <div style="display: flex; gap: 0.5rem;">
              <button id="btn-copy-clipboard" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy Text
              </button>
              <button id="btn-download-txt" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download .txt
              </button>
            </div>
          </div>

          <div class="stationery-outer">
            <div id="letter-paper" class="letter-paper" role="region" aria-label="Cover Letter Live Preview">
              <!-- Rendered via script -->
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <!-- Structured schema -->
  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Cover Letter Builder Studio",

    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "ALL IN ONE",
      "url": "https://sami12901.github.io/ALL-IN-ONE-v1/"
    }
  }
  </script>
</body>
</html>
