<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Tag Generator - ALL IN ONE</title>
  <meta name="description" content="Generate complete SEO and Open Graph meta tags for your website.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 1rem; }
    
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    
    .output-box {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--stroke);
      border-radius: 0.5rem;
      padding: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #93c5fd;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 400px;
    }
    
    .char-counter { font-size: 0.75rem; text-align: right; color: var(--muted); margin-top: 2px; }
    .char-counter.warning { color: #f59e0b; }
    .char-counter.danger { color: #ef4444; }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Meta Tag Generator</h1>
        <p class="tool-description">Generate the perfect SEO HTML tags to place inside your &lt;head&gt;.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          <div class="form-group">
            <label>Site Title (Max 60 chars)</label>
            <input type="text" id="meta-title" class="form-input" placeholder="My Awesome Website">
            <div id="count-title" class="char-counter">0 / 60</div>
          </div>
          
          <div class="form-group">
            <label>Site Description (Max 160 chars)</label>
            <textarea id="meta-desc" class="form-textarea" rows="3" placeholder="Discover the best awesome things on our website..."></textarea>
            <div id="count-desc" class="char-counter">0 / 160</div>
          </div>
          
          <div class="form-group">
            <label>Keywords (Comma separated)</label>
            <input type="text" id="meta-keywords" class="form-input" placeholder="tools, utilities, awesome">
          </div>
          
          <div class="form-group">
            <label>Author</label>
            <input type="text" id="meta-author" class="form-input" placeholder="John Doe">
          </div>
          
          <div class="form-group">
            <label>Site URL (For Open Graph)</label>
            <input type="url" id="meta-url" class="form-input" placeholder="https://example.com">
          </div>
          
          <div class="form-group">
            <label>Preview Image URL (For social sharing)</label>
            <input type="url" id="meta-image" class="form-input" placeholder="https://example.com/banner.jpg">
          </div>
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Generated HTML Code</label>
          <div id="output-code" class="output-box">
            <!-- Code generated here -->
          </div>
          <button class="btn btn-primary" id="btn-copy" style="justify-content: center;">
            Copy Tags
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
