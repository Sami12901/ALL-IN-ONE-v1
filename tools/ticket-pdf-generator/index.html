    .layout { display: flex; flex-direction: column; gap: 2rem; max-width: 800px; margin: 0 auto; }
    
    .section-card { background: var(--surface); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }

<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>Ticket PDF Generator</h1>
        <p class="tool-description">Create custom printable event tickets with barcodes. Generates standard 150x50mm landscape tickets.</p>
      </div>

      <div class="layout">
        
        <div class="section-card">
          <div class="section-title">Event Information</div>
          <div class="form-group">
            <label>Event Name</label>
            <input type="text" id="t-event" class="form-input" placeholder="Summer Music Festival 2026">
          </div>
          <div class="form-group">
            <label>Venue / Location</label>
            <input type="text" id="t-venue" class="form-input" placeholder="Grand Arena, Downtown">
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Date</label><input type="date" id="t-date" class="form-input"></div>
            <div class="form-group"><label>Time</label><input type="time" id="t-time" class="form-input" value="19:00"></div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-title">Ticket Details</div>
          <div class="grid-3">
            <div class="form-group">
              <label>Ticket Type</label>
              <select id="t-type" class="form-input">
                <option value="GENERAL ADMISSION">General Admission</option>
                <option value="VIP PASS">VIP Pass</option>
                <option value="BACKSTAGE">Backstage</option>
                <option value="EARLY BIRD">Early Bird</option>
              </select>
            </div>
            <div class="form-group"><label>Price ($)</label><input type="number" id="t-price" class="form-input" value="50.00" step="0.01"></div>
            <div class="form-group"><label>Seat / Section</label><input type="text" id="t-seat" class="form-input" placeholder="Section A, Row 4"></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Attendee Name (Optional)</label><input type="text" id="t-name" class="form-input" placeholder="John Doe"></div>
            <div class="form-group"><label>Ticket ID / Barcode</label><input type="text" id="t-id" class="form-input" value="TKT-9988776655"></div>
          </div>
        </div>
        
        <!-- Hidden canvas for barcode generation -->
        <canvas id="barcode-canvas" style="display: none;"></canvas>

        <button class="btn btn-primary" id="btn-generate" style="padding: 1.5rem; font-size: 1.2rem; justify-content: center;">
          Generate Printable Ticket
        </button>
        
      </div>
    </div>
  </main>
