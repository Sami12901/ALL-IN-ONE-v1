<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode Emoji Picker &amp; Search Suite - ALL IN ONE</title>
  <meta name="description" content="Free online Unicode emoji picker and search engine. Browse categorized emojis (Smileys, People, Animals, Food, Travel, Objects, Symbols, Flags) with real-time keyword search, skin tone modifiers, and 1-click clipboard copy.">
  <meta name="keywords" content="emoji picker, search emoji, unicode emojis, copy emoji, smileys, copy and paste emojis, online emoji keyboard, skin tone modifier">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/emoji-picker/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <style>
    .emoji-picker-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .emoji-search-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.6rem 1rem;
      transition: var(--transition);
    }
    .emoji-search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .emoji-search-input {
      background: transparent;
      border: none;
      font-size: 1rem;
      color: var(--text-primary);
      width: 100%;
      outline: none;
    }
    .category-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .category-pill {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 0.35rem 0.85rem;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
    }
    .category-pill:hover, .category-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }
    .emoji-grid-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      min-height: 420px;
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 0.5rem;
      max-height: 520px;
      overflow-y: auto;
      padding: 0.25rem;
    }
    .emoji-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      user-select: none;
    }
    .emoji-btn:hover {
      transform: scale(1.2);
      background: var(--accent-glow);
      border-color: var(--accent);
      z-index: 2;
    }
    .recents-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
    }
    .emoji-preview-inspector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin-top: 1rem;
    }
  </style>

  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">Unicode Emoji Picker &amp; Search</h1>
        <p class="tool-description">Browse 1800+ standard Unicode emojis organized by category. Real-time keyword search, recently used memory, and 1-click clipboard copy for social media and messaging.</p>
      </div>

      <div class="emoji-picker-container">
        <!-- Search and Tone Filter -->
        <div class="emoji-search-bar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="emoji-search-input" class="emoji-search-input" placeholder="Search emojis by name, tag, or keyword (e.g. fire, happy, rocket, cat)..." autocomplete="off" spellcheck="false">
          <button type="button" id="btn-clear-search" style="background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 1.1rem;">&times;</button>
        </div>

        <!-- Category Filter Pills -->
        <div class="category-pills-row" id="category-pills">
          <button type="button" class="category-pill active" data-cat="all">🌟 All Emojis</button>
          <button type="button" class="category-pill" data-cat="smileys">😀 Smileys &amp; Emotion</button>
          <button type="button" class="category-pill" data-cat="people">👋 People &amp; Body</button>
          <button type="button" class="category-pill" data-cat="animals">🐶 Animals &amp; Nature</button>
          <button type="button" class="category-pill" data-cat="food">🍔 Food &amp; Drink</button>
          <button type="button" class="category-pill" data-cat="travel">✈️ Travel &amp; Places</button>
          <button type="button" class="category-pill" data-cat="activities">⚽ Activities &amp; Sports</button>
          <button type="button" class="category-pill" data-cat="objects">💡 Objects &amp; Tech</button>
          <button type="button" class="category-pill" data-cat="symbols">❤️ Symbols &amp; Math</button>
          <button type="button" class="category-pill" data-cat="flags">🚩 Flags</button>
        </div>

        <!-- Recent Emojis Strip -->
        <div class="recents-strip" id="recents-container">
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase;">Recent:</span>
          <div id="recents-list" style="display: flex; gap: 0.4rem; flex-wrap: wrap;"></div>
        </div>

        <!-- Main Emoji Grid Stage -->
        <div class="emoji-grid-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
            <span id="category-heading" style="font-weight: 700; color: var(--text-primary); font-size: 1.1rem;">All Emojis</span>
            <span id="emoji-count-badge" style="font-size: 0.8rem; color: var(--text-tertiary);">Showing emojis</span>
          </div>

          <div class="emoji-grid" id="emoji-grid">
            <!-- Dynamically populated emoji buttons -->
          </div>

          <!-- Bottom Active Inspector -->
          <div class="emoji-preview-inspector" id="emoji-inspector">
            <div style="display: flex; align-items: center; gap: 1rem;">
              <span id="inspect-glyph" style="font-size: 2.8rem; line-height: 1;">✨</span>
              <div>
                <strong id="inspect-name" style="font-size: 1.1rem; color: var(--text-primary); display: block;">Sparkles</strong>
                <span id="inspect-code" style="font-family: monospace; font-size: 0.85rem; color: var(--accent);">U+2728</span>
              </div>
            </div>
            <button type="button" class="btn btn-primary" id="btn-copy-inspected">
              📋 Copy Emoji to Clipboard
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <app-footer></app-footer>
</body>
</html>
