<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Length Calculator - ALL IN ONE</title>
  <meta name="description" content="Calculate character count, word count, and byte size of your text instantly.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .metric-card {
      background: rgba(15, 15, 15, 0.4);
      border: 1px solid var(--stroke);
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .metric-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-display);
    }
    .metric-label {
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .toolbar { display: flex; justify-content: flex-end; margin-top: 0.5rem; }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>String Length Calculator</h1>
        <p class="tool-description">Instantly count characters, words, lines, and bytes in real-time.</p>
      </div>

      <div class="tool-panel glass-panel">
        <div class="metrics-grid">
          <div class="metric-card">
            <span class="metric-value" id="val-chars">0</span>
            <span class="metric-label">Characters</span>
          </div>
          <div class="metric-card">
            <span class="metric-value" id="val-words">0</span>
            <span class="metric-label">Words</span>
          </div>
          <div class="metric-card">
            <span class="metric-value" id="val-lines">0</span>
            <span class="metric-label">Lines</span>
          </div>
          <div class="metric-card">
            <span class="metric-value" id="val-bytes">0</span>
            <span class="metric-label">Bytes</span>
          </div>
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Text Input</label>
          <textarea id="input-text" class="form-textarea" rows="10" placeholder="Type or paste your text here..."></textarea>
          <div class="toolbar">
            <button class="btn btn-secondary btn-sm" id="btn-clear">Clear Text</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
