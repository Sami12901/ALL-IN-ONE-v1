<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Data Typing Practice - ALL IN ONE</title>
  <meta name="description" content="Practice typing tabular data quickly and accurately with this Excel simulator.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="../../js/main.js" defer></script>
  <style>
    .workspace-grid {
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
    }

    @media (max-width: 992px) {
      .workspace-grid {
        grid-template-columns: 1fr;
      }
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .stat-box {
      background: var(--bg-tertiary);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      min-width: 100px;
      text-align: center;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      font-family: var(--font-display);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.25rem;
    }

    /* Excel Table Styles */
    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.85rem;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    
    .excel-table th, .excel-table td {
      border: 1px solid var(--border);
      padding: 4px 8px;
      height: 25px;
      overflow: hidden;
      white-space: nowrap;
    }
    
    .excel-table th {
      background: var(--bg-tertiary);
      font-weight: 600;
      text-align: center;
      color: var(--text-primary);
    }

    .excel-table tr > td:first-child,
    .excel-table tr > th:first-child {
      background: var(--bg-tertiary);
      width: 30px;
      text-align: center;
      color: var(--text-secondary);
    }

    .reference-table td {
      background: var(--bg-primary);
    }

    .input-table input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      padding: 0;
      margin: 0;
      font-family: inherit;
      font-size: inherit;
      color: var(--text-primary);
    }

    .input-table input:focus {
      background: rgba(16, 124, 65, 0.2);
    }

    .input-table td.correct {
      background: rgba(16, 185, 129, 0.2);
    }

    .input-table td.incorrect {
      background: rgba(239, 68, 68, 0.2);
    }

    .cell-selected {
      border: 2px solid #107c41 !important; /* Excel green */
      box-shadow: 0 0 0 1px #107c41 inset;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
    }

  </style>
</head>
<body>
  <app-header></app-header>
  
  <main class="tool-layout">
    <div class="container tool-container">
    <app-breadcrumbs></app-breadcrumbs>
      <div class="tool-header">
        <h1>Excel Data Typing Practice</h1>
      </div>

    <!-- Top Stats Bar -->
    <div class="stats-header glass-panel" style="padding: 1rem; margin-bottom: 1rem; border-radius: var(--radius-md);">
      <div style="display: flex; gap: 1rem; align-items: center;">
        <select id="dataset-select" class="form-input" style="width: auto;">
          <option value="sales">Sales Report</option>
          <option value="inventory">Inventory List</option>
          <option value="contacts">Customer Contacts</option>
        </select>
        <button id="start-btn" class="btn btn-primary" style="padding: 0.5rem 1rem;">Start Practice</button>
      </div>
      <div style="display: flex; gap: 1rem;">
        <div class="stat-box" style="padding: 0.5rem;">
          <div class="stat-value" id="stat-cells">0/0</div>
          <div class="stat-label">Cells Completed</div>
        </div>
        <div class="stat-box" style="padding: 0.5rem;">
          <div class="stat-value" id="stat-time">00:00</div>
          <div class="stat-label">Timer</div>
        </div>
        <div class="stat-box" style="padding: 0.5rem;">
          <div class="stat-value" id="stat-acc">100%</div>
          <div class="stat-label">Accuracy</div>
        </div>
      </div>
    </div>

    <div class="tool-workarea split-view">
      <!-- Reference Data (Left) -->
      <div class="tool-panel glass-panel" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
        <div style="background: #107c41; color: white; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
          Reference Data (Source)
        </div>
        <div style="overflow: auto; flex: 1; padding: 10px; background: var(--bg-secondary); border-top: 1px solid var(--border);">
          <table class="excel-table reference-table" id="reference-table">
            <!-- Rendered by JS -->
          </table>
        </div>
      </div>

      <!-- Practice Area (Right) -->
      <div class="tool-panel glass-panel" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">
        <div style="background: #107c41; color: white; padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          Your Workspace (Type Here)
        </div>
        <div style="overflow: auto; flex: 1; padding: 10px; background: var(--bg-secondary); border-top: 1px solid var(--border);">
          <table class="excel-table input-table" id="input-table">
            <!-- Rendered by JS -->
          </table>
        </div>
      </div>
    </div>

    <!-- Results Modal (Hidden by default) -->
    <div id="results-modal" style="display: none; margin-top: 2rem; background: var(--bg-tertiary); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--primary); text-align: center;">
      <h3 style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-primary);">Practice Complete!</h3>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Here is your data entry performance:</p>
      
      <div style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem;">
        <div>
          <div style="font-size: 3rem; font-weight: 800; color: #10b981;" id="final-time">00:00</div>
          <div style="font-size: 0.9rem; color: var(--text-tertiary); text-transform: uppercase;">Time Taken</div>
        </div>
        <div>
          <div style="font-size: 3rem; font-weight: 800; color: var(--primary);" id="final-acc">--</div>
          <div style="font-size: 0.9rem; color: var(--text-tertiary); text-transform: uppercase;">Accuracy</div>
        </div>
      </div>
      
      <button id="try-again-btn" class="btn btn-primary">Try Another Dataset</button>
    </div>

  </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
