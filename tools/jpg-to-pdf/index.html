<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPG to PDF - ALL IN ONE</title>
  <meta name="description" content="Convert your JPG images into a single PDF document.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    .layout { display: flex; flex-direction: column; gap: 2rem; max-width: 800px; margin: 0 auto; }
    .upload-zone { border: 2px dashed var(--stroke); border-radius: 1rem; padding: 3rem 2rem; text-align: center; background: rgba(0,0,0,0.2); transition: all 0.2s; cursor: pointer; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.05); }
    
    .file-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
    .file-item { background: var(--surface); border: 1px solid var(--stroke); padding: 1rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: space-between; }
  </style>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>JPG to PDF</h1>
        <p class="tool-description">Instantly bundle your JPG images into a single PDF document. 100% offline.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        
        <div class="upload-zone" id="upload-zone">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1" fill="none" style="margin-bottom: 1rem; color: var(--muted);"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          <h3 style="margin-bottom: 0.5rem;">Drop JPG files here</h3>
          <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">or click to browse (Select multiple files)</p>
          <button class="btn btn-secondary" id="btn-browse" style="margin: 0 auto;">Select JPGs</button>
          <input type="file" id="file-input" accept="image/jpeg, image/jpg" multiple style="display: none;">
        </div>
        
        <div id="workspace" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="margin: 0;">Selected Images</h3>
            <button class="btn btn-secondary" id="btn-change" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Clear All</button>
          </div>
          
          <div class="file-list" id="file-list"></div>

          <button class="btn btn-primary" id="btn-execute" style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem; margin-top: 2rem;">
            Convert to PDF & Download
          </button>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
