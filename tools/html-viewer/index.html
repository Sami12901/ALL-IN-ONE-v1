<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Output Viewer - ALL IN ONE</title>
  <meta name="description" content="Live preview raw HTML, CSS, and JS code in an isolated sandbox. Fast, free, and completely offline.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <script type="module" src="../../js/components.js"></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
  <script type="module" src="../../js/main.js" defer></script>
</head>
<body>
  <app-header></app-header>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="breadcrumb-container">
        <ul class="breadcrumbs">
          <li class="breadcrumb-item"><a href="../../index.html">Dashboard</a></li>
          <li class="breadcrumb-item"><a href="#">Developer Tools</a></li>
          <li class="breadcrumb-item active">HTML Viewer</li>
        </ul>
      </div>

      <div class="tool-header">
        <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">HTML Output Viewer</h1>
        <p class="tool-description">Instantly preview your raw HTML, CSS, and JS code. The output is rendered securely in an isolated iframe sandbox.</p>
      </div>

      <div class="tool-workarea split-view">
        <!-- Input Section -->
        <div class="glass-panel tool-panel">
          <div class="panel-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            HTML Code Editor
          </div>
          <div class="form-group" style="flex: 1;">
            <textarea id="html-input" class="form-textarea" placeholder="Type or paste your HTML code here...
Example:
<h1 style='color: red;'>Hello World</h1>
<script>console.log('Tested!');</script>" style="height: 100%; min-height: 400px; font-family: monospace;"></textarea>
          </div>
          <div class="action-bar">
            <button id="clear-btn" class="btn btn-secondary">Clear Input</button>
            <button id="paste-btn" class="btn btn-secondary">Paste from Clipboard</button>
            <button id="render-btn" class="btn btn-primary" style="margin-left: auto;">Render Preview</button>
          </div>
        </div>

        <!-- Output Section -->
        <div class="glass-panel tool-panel" style="display: flex; flex-direction: column;">
          <div class="panel-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            Live Preview
          </div>
          
          <div style="flex: 1; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: #ffffff;">
            <!-- Use a sandbox to prevent the inner script from maliciously affecting the top window, but allow scripts to run for prototyping -->
            <iframe id="preview-frame" style="width: 100%; height: 100%; min-height: 400px; border: none; background: white;" sandbox="allow-scripts"></iframe>
          </div>
          
          <div class="checkbox-group" style="flex-direction: row; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
            <label class="checkbox-label">
              <input type="checkbox" id="opt-auto" checked>
              Auto-render on type
            </label>
          </div>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
