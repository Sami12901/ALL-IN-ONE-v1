  <style>
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      align-items: end;
      margin-bottom: 1rem;
    }
    .panel-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .panel-header-row .panel-title {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .panel-meta {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      font-family: monospace;
    }
    .editor-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 380px;
    }
    .code-area {
      flex: 1;
      width: 100%;
      min-height: 380px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 0.875rem;
      line-height: 1.5;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1rem;
      resize: vertical;
      outline: none;
      tab-size: 2;
      transition: border-color 0.2s ease;
    }
    .code-area:focus {
      border-color: var(--accent);
      background: var(--bg-secondary);
    }
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--error);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.4;
    }
    .success-banner {
      display: none;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--success);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>JSON to XML Converter</h1>
        <p class="tool-description">Seamlessly translate nested JSON structures into valid XML documents with configurable root/item tags, attribute prefix (@) notation, and real-time conversion.</p>
      </div>

      <!-- Controls Panel -->
      <div class="tool-panel glass-panel">
        <div class="options-grid">
          <div class="form-group">
            <label for="root-element">Root Element Name</label>
            <input type="text" id="root-element" class="form-input" value="root" placeholder="root">
          </div>

          <div class="form-group">
            <label for="item-element">Array Item Name</label>
            <input type="text" id="item-element" class="form-input" value="item" placeholder="item">
          </div>

          <div class="form-group">
            <label for="attr-prefix">Attribute Prefix</label>
            <input type="text" id="attr-prefix" class="form-input" value="@" placeholder="@">
          </div>

          <div class="form-group">
            <label for="xml-indent">Indentation</label>
            <select id="xml-indent" class="form-select">
              <option value="2" selected>2 Spaces</option>
              <option value="4">4 Spaces</option>
              <option value="tab">Tabs</option>
              <option value="compact">Compact (Minified)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sample-json">Load Sample JSON</label>
            <select id="sample-json" class="form-select">
              <option value="">-- Choose Sample --</option>
              <option value="ecommerce">E-Commerce Store &amp; Products</option>
              <option value="userlist">User Accounts &amp; Permissions</option>
              <option value="nestedarray">Deeply Nested Multilevel Data</option>
            </select>
          </div>
        </div>

        <div class="checkbox-group" style="flex-direction: row; flex-wrap: wrap; gap: 1.5rem;">
          <label class="checkbox-label">
            <input type="checkbox" id="realtime-toggle" checked>
            <span>Real-time conversion</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="xml-declaration" checked>
            <span>Include XML declaration (&lt;?xml version="1.0" ...?&gt;)</span>
          </label>
        </div>
      </div>

      <!-- Workspace Split View -->
      <div class="tool-workarea split-view">
        <!-- Input Panel -->
        <div class="tool-panel glass-panel">
          <div class="panel-header-row">
            <h2 class="panel-title">JSON Input</h2>
            <span id="input-stats" class="panel-meta">Lines: 0 | Chars: 0</span>
          </div>

          <div id="json-error-banner" class="error-banner"></div>

          <div class="editor-wrapper">
            <textarea id="json-input" class="code-area" placeholder='Paste JSON here... e.g. {"name": "Example", "@id": "123"}' spellcheck="false"></textarea>
          </div>

          <div class="action-bar">
            <button id="convert-btn" class="btn btn-primary">Convert to XML</button>
            <button id="clear-btn" class="btn btn-secondary">Clear</button>
          </div>
        </div>

        <!-- Output Panel -->
        <div class="tool-panel glass-panel">
          <div class="panel-header-row">
            <h2 class="panel-title">XML Output</h2>
            <span id="output-stats" class="panel-meta">Lines: 0 | Chars: 0</span>
          </div>

          <div id="xml-success-banner" class="success-banner">Successfully converted to XML!</div>

          <div class="editor-wrapper">
            <button id="copy-btn" class="copy-btn" title="Copy to clipboard">Copy</button>
            <textarea id="xml-output" class="code-area" readonly placeholder="Generated XML will appear here..." spellcheck="false" style="padding-top: 2.5rem;"></textarea>
          </div>

          <div class="action-bar">
            <button id="download-btn" class="btn btn-secondary">Download .xml</button>
            <button id="copy-action-btn" class="btn btn-secondary">Copy XML</button>
          </div>
        </div>
      </div>
    
    </div>
  </main>

  <app-footer></app-footer>
