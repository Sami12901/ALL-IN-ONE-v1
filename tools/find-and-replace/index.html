<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find and Replace - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Search and replace text patterns using string or regex.">
  <meta name="keywords" content="find, replace, search, regex, free, online, tool, utility">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/find-and-replace/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Find and Replace</h1>
        <p class="tool-description">Search and replace text patterns using string or regex.</p>
      </div>

      <!-- Tool Workspace -->
      
      <div class="tool-workarea split-view">
        <div class="tool-panel glass-panel">
          <div class="panel-title">Input Text</div>
          <div class="form-group">
            <textarea id="inputText" class="form-textarea" placeholder="Type or paste your text here..." autofocus style="min-height: 150px;"></textarea>
          </div>
          
          <div class="form-group">
            <label for="findInput">Find</label>
            <input type="text" id="findInput" class="form-input" placeholder="Text or Regex to find...">
          </div>
          
          <div class="form-group">
            <label for="replaceInput">Replace With</label>
            <input type="text" id="replaceInput" class="form-input" placeholder="Replacement text...">
          </div>
          
          <div class="checkbox-group" style="flex-direction: row; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.5rem; margin-bottom: 0.5rem;">
            <label class="checkbox-label">
              <input type="checkbox" id="useRegex">
              Use Regex
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="matchCase">
              Match Case
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="matchWholeWord">
              Match Whole Word
            </label>
          </div>
          
          <div class="action-bar">
            <button id="clearBtn" class="btn btn-secondary">Clear</button>
            <button id="replaceBtn" class="btn btn-primary" style="flex: 1;">Replace All</button>
          </div>
        </div>
        
        <div class="tool-panel glass-panel">
          <div class="panel-title">Output</div>
          <div class="output-box" id="outputArea" style="min-height: 250px;">
            <button id="copyBtn" class="copy-btn">Copy</button>
            <div id="resultText"></div>
          </div>
          <div id="statusMessage" style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem; text-align: right;"></div>
        </div>
      </div>
    
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <!-- Structured schema for search engine rich snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Find and Replace",
    "url": "https://sami12901.github.io/ALL-IN-ONE-v1/tools/find-and-replace/",
    "description": "Search and replace text patterns using string or regex.",
    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>
</body>
</html>
