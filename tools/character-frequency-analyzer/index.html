  <style>
    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .results-box {
      background: rgba(15,15,15,0.4); border: 1px solid var(--stroke); border-radius: 0.5rem;
      height: 400px; overflow-y: auto; padding: 0.5rem;
    }
    .freq-item {
      display: flex; justify-content: space-between; padding: 0.5rem; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;
    }
    .freq-item:last-child { border-bottom: none; }
    .freq-char { 
      font-weight: 600; color: var(--accent); font-family: var(--font-mono);
      background: rgba(255,255,255,0.1); padding: 0.2rem 0.6rem; border-radius: 4px;

<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Character Frequency Analyzer</h1>
        <p class="tool-description">Break down your text character by character to find the most used letters.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          <div class="options-bar">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
              <input type="checkbox" id="opt-ignore-spaces" checked style="accent-color: var(--accent);"> Ignore Spaces
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem;">
              <input type="checkbox" id="opt-case-insensitive" checked style="accent-color: var(--accent);"> Case Insensitive
            </label>
          </div>
          
          <label style="font-weight: 600; font-size: 0.9rem;">Input Text</label>
          <textarea id="input-text" class="form-textarea" style="height: 350px;" placeholder="Paste an article, essay, or any text here..."></textarea>
          <div class="toolbar">
            <span class="text-xs text-muted" id="char-count">0 total characters</span>
            <button class="btn btn-secondary btn-sm" id="btn-clear">Clear</button>
          </div>
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Frequency Results</label>
          <div class="results-box" id="results-box">
            <div style="padding: 1rem; text-align: center; color: var(--muted); font-size: 0.85rem;">Results will appear here</div>
          </div>
        </div>
      </div>
    </div>
  </main>
