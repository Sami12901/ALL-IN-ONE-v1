<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Generate placeholder text with custom counts.">
  <meta name="keywords" content="lorem, ipsum, placeholder, dummy, text, free, online, tool, utility">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/lorem-ipsum-generator/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Lorem Ipsum Generator</h1>
        <p class="tool-description">Generate placeholder text with custom counts.</p>
      </div>

      <!-- Tool Workspace -->
      
      <div class="tool-workarea">
        <div class="tool-panel glass-panel">
          <div class="panel-title">Generator Settings</div>
          
          <div class="form-group">
            <label for="countInput">Count (How many?)</label>
            <input type="number" id="countInput" value="3" min="1" max="100" class="form-input">
          </div>
          
          <div class="form-group">
            <label for="typeSelect">Format Type</label>
            <select id="typeSelect" class="form-select">
              <option value="paragraphs">Paragraphs</option>
              <option value="sentences">Sentences</option>
              <option value="words">Words</option>
              <option value="list">List Items</option>
            </select>
          </div>
          
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="startWithLorem" checked>
              Start with "Lorem ipsum dolor sit amet..."
            </label>
          </div>
          
          <div class="action-bar">
            <button id="generateBtn" class="btn btn-primary" style="width: 100%;">Generate Text</button>
          </div>
        </div>
        
        <div class="tool-panel glass-panel">
          <div class="panel-title">Generated Output</div>
          <div class="output-box" id="outputArea">
            <button id="copyBtn" class="copy-btn">Copy</button>
            <div id="resultText"></div>
          </div>
        </div>
      </div>
    
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <!-- Structured schema for search engine rich snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Lorem Ipsum Generator",
    "url": "https://sami12901.github.io/ALL-IN-ONE-v1/tools/lorem-ipsum-generator/",
    "description": "Generate placeholder text with custom counts.",
    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>
</body>
</html>
