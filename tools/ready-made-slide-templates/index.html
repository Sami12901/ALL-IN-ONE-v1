  <style>
    /* Slide Studio Specific Styles */
    .studio-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-counter {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.6rem;
      border-radius: var(--radius-full);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* 2-Column Split Studio Grid */
    .studio-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 992px) {
      .studio-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Left Sidebar Tabs */
    .sidebar-tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.825rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }
    .tab-btn:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }
    .tab-btn.active {
      color: var(--accent);
      background: var(--bg-tertiary);
      border-color: var(--border);
    }

    /* Slides List in Deck */
    .deck-slides-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 580px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .slide-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      gap: 0.5rem;
    }
    .slide-list-item:hover {
      border-color: var(--accent);
      transform: translateX(2px);
    }
    .slide-list-item.active {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb, 99, 102, 241), 0.12);
      box-shadow: 0 0 10px rgba(var(--accent-rgb, 99, 102, 241), 0.2);
    }
    .slide-item-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow: hidden;
    }
    .slide-num-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .slide-item-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .slide-item-type {
      font-size: 0.7rem;
      color: var(--text-tertiary);
      display: block;
    }
    .slide-item-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .icon-action-btn {
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: var(--transition);
    }
    .icon-action-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Template Library Grid */
    .template-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }
    .filter-chip {
      padding: 0.25rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-chip:hover, .filter-chip.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(var(--accent-rgb, 99, 102, 241), 0.15);
    }
    .template-cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .template-card {
      padding: 0.75rem;
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .template-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .template-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .template-card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .template-card-cat {
      font-size: 0.68rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .template-card-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    /* Center/Right: Slide Canvas */
    .slide-viewport-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .slide-canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .slide-canvas-content {
      width: 100%;
      height: 100%;
      padding: 2.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: radial-gradient(circle at 85% 15%, rgba(99, 102, 241, 0.12), transparent 50%),
                  radial-gradient(circle at 15% 85%, rgba(168, 85, 247, 0.08), transparent 50%),
                  #0c101c;
      color: #f8fafc;
      user-select: none;
    }

    /* Slide Elements */
    .slide-header-box {
      margin-bottom: 1rem;
    }
    .slide-kicker {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .slide-title-text {
      font-family: var(--font-display, inherit);
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 0.4rem;
    }
    .slide-subtitle-text {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.45;
      max-width: 800px;
    }
    .slide-body-box {
      flex: 1;
      display: flex;
      align-items: center;
      margin: 0.75rem 0;
    }
    .slide-footer-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #64748b;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.75rem;
    }

    /* Layout Primitives inside Canvas */
    .grid-3-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      width: 100%;
    }
    .slide-glass-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .card-metric-val {
      font-size: 1.65rem;
      font-weight: 800;
      color: #38bdf8;
      font-family: var(--font-display, inherit);
    }
    .card-metric-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-metric-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.35;
    }

    .slide-bullet-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }
    .slide-bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent);
      font-size: 0.88rem;
      color: #e2e8f0;
      line-height: 1.4;
    }
    .slide-bullet-icon {
      color: var(--accent);
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Inspector Editor Panel */
    .inspector-panel {
      padding: 1.25rem;
      border-radius: var(--radius-lg);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .inspector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .inspector-fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    @media (max-width: 768px) {
      .inspector-fields-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Fullscreen Presentation Modal */
    .present-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #06080e;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .present-modal.active {
      display: flex;
    }
    .present-canvas-box {
      width: 95vw;
      max-width: 1366px;
      aspect-ratio: 16 / 9;
      background: #090d16;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
    }
    .present-hud {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-full);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 10000;
    }
    .present-hud-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .present-hud-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    .present-hud-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      padding: 0 0.5rem;
    }
    .present-hud-timer {
      font-size: 0.8rem;
      font-family: monospace;
      color: #94a3b8;
      padding: 0 0.5rem;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Print Stylesheet for Print-to-PDF */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-slides-container, #print-slides-container * {
        visibility: visible;
      }
      #print-slides-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block !important;
      }
      .print-slide-page {
        page-break-after: always;
        break-after: page;
        width: 100vw;
        height: 56.25vw; /* 16:9 */
        max-height: 100vh;
        margin: 0;
        padding: 2rem;
        box-sizing: border-box;
        background: #0c101c !important;
        color: #f8fafc !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Ready-Made Slide Templates</h1>
        <p class="tool-description">Access a comprehensive library of 20+ specialized slide templates. Assemble custom decks, edit content in real-time, present fullscreen, and export to HTML, JSON, or Print-to-PDF.</p>
      </div>

      <!-- Studio Action Toolbar -->
      <div class="studio-toolbar glass-panel">
        <div class="toolbar-left">
          <label for="select-preset-deck" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Preset Decks:</label>
          <select id="select-preset-deck" class="form-select" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;">
            <option value="pitch">Startup Pitch Deck (10 slides)</option>
            <option value="travel">Travel Proposal Itinerary (7 slides)</option>
            <option value="brand">Brand Identity Guidelines (6 slides)</option>
            <option value="product">Product Launch & Architecture (8 slides)</option>
            <option value="blank">Blank Slate (1 Title slide)</option>
          </select>
          <button id="btn-load-preset" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Load Preset</button>
          <span class="badge-counter" id="deck-slide-count-badge">10 Slides</span>
        </div>
        <div class="toolbar-right">
          <button id="btn-fullscreen-present" class="btn btn-primary" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            Present (F5)
          </button>
          <button id="btn-export-html" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" title="Download self-contained HTML slideshow file">Export HTML</button>
          <button id="btn-export-pdf" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" title="Print or save as PDF">Print / PDF</button>
          <button id="btn-export-json" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" title="Export editable JSON deck file">Export JSON</button>
          <label class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; cursor: pointer;" title="Import previously saved JSON deck">
            Import JSON <input type="file" id="file-import-deck" accept=".json" style="display: none;">
          </label>
        </div>
      </div>

      <!-- Main Studio 2-Column Grid -->
      <div class="studio-grid">
        <!-- Left: Deck Manager & Template Browser -->
        <div class="tool-panel glass-panel" style="padding: 1.25rem;">
          <div class="sidebar-tabs">
            <button class="tab-btn active" id="tab-btn-deck">Current Deck (<span id="tab-deck-count">10</span>)</button>
            <button class="tab-btn" id="tab-btn-library">Template Library (21)</button>
          </div>

          <!-- Tab Content 1: Deck Slides List -->
          <div id="tab-panel-deck">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
              <span style="font-size: 0.78rem; color: var(--text-tertiary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Slide Order</span>
              <button id="btn-add-quick-slide" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">+ Add Slide</button>
            </div>
            <div class="deck-slides-list" id="deck-slides-list">
              <!-- Dynamically populated slide list -->
            </div>
          </div>

          <!-- Tab Content 2: Template Library Browser -->
          <div id="tab-panel-library" style="display: none;">
            <div class="template-filter-bar" id="template-filter-bar">
              <button class="filter-chip active" data-filter="all">All (21)</button>
              <button class="filter-chip" data-filter="pitch">Pitch & VC</button>
              <button class="filter-chip" data-filter="business">Business</button>
              <button class="filter-chip" data-filter="travel">Travel</button>
              <button class="filter-chip" data-filter="brand">Brand</button>
              <button class="filter-chip" data-filter="marketing">Marketing</button>
              <button class="filter-chip" data-filter="tech">Tech</button>
            </div>
            <div class="template-cards-grid" id="template-cards-grid">
              <!-- 21 Template Cards populated dynamically -->
            </div>
          </div>
        </div>

        <!-- Right: Live Canvas & Slide Inspector -->
        <div class="slide-viewport-wrapper">
          <!-- Slide Canvas Viewport -->
          <div class="slide-canvas-container" id="slide-canvas-container">
            <div class="slide-canvas-content" id="slide-canvas-content">
              <!-- Rendered Active Slide HTML -->
            </div>
          </div>

          <!-- Slide Inspector & Live Form -->
          <div class="inspector-panel glass-panel" id="inspector-panel">
            <div class="inspector-header">
              <div>
                <span id="inspector-slide-pill" style="font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase;">Editing Slide 1</span>
                <h3 id="inspector-slide-heading" style="font-size: 1.05rem; margin: 0; color: var(--text-primary);">Slide Content</h3>
              </div>
              <div style="display: flex; gap: 0.5rem;">
                <button id="btn-duplicate-slide" class="btn btn-secondary" style="padding: 0.3rem 0.65rem; font-size: 0.78rem;">Duplicate</button>
                <button id="btn-delete-slide" class="btn btn-secondary" style="padding: 0.3rem 0.65rem; font-size: 0.78rem; color: #ef4444; border-color: rgba(239,68,68,0.3);">Delete</button>
              </div>
            </div>

            <!-- Dynamic Fields Render Area -->
            <div id="inspector-fields-container">
              <!-- Fields populated dynamically based on active slide layout -->
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Fullscreen Presentation Overlay -->
  <div class="present-modal" id="present-modal">
    <div class="present-canvas-box">
      <div class="slide-canvas-content" id="present-canvas-content" style="padding: 4rem;">
        <!-- Fullscreen Slide Render -->
      </div>
    </div>
    <div class="present-hud">
      <button class="present-hud-btn" id="present-btn-prev">&larr; Prev</button>
      <span class="present-hud-counter" id="present-hud-counter">1 / 10</span>
      <button class="present-hud-btn" id="present-btn-next">Next &rarr;</button>
      <span class="present-hud-timer" id="present-hud-timer">00:00</span>
      <button class="present-hud-btn" id="present-btn-exit" style="color: #f87171;">Exit [Esc]</button>
    </div>
  </div>

  <!-- Hidden Container for Print-to-PDF -->
  <div id="print-slides-container" style="display: none;"></div>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <!-- Structured schema for search engine rich snippets -->
  <script type="application/ld+json">
