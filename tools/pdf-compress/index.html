<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Compress - ALL IN ONE</title>
  <meta name="description" content="Reduce PDF file size securely in your browser.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    .compress-layout { display: flex; flex-direction: column; gap: 2rem; max-width: 800px; margin: 0 auto; }
    
    .upload-zone {
      border: 2px dashed var(--stroke); border-radius: 1rem; padding: 3rem 2rem;
      text-align: center; background: rgba(0,0,0,0.2); transition: all 0.2s; cursor: pointer;
    }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(var(--accent-rgb), 0.05); }

    .file-info-card { background: var(--surface); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; display: flex; align-items: center; gap: 1.5rem; }
    .file-icon { color: #ef4444; }
    .file-details { flex-grow: 1; overflow: hidden; }
    .file-name { font-weight: 600; font-size: 1.1rem; color: var(--text); margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
    
    .options-card { background: rgba(0,0,0,0.3); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .slider-container { display: flex; align-items: center; gap: 1rem; }
    .quality-slider { flex-grow: 1; }
    .quality-label { font-size: 0.85rem; color: var(--accent); font-weight: bold; width: 50px; text-align: right; }

    #progress-bar-container { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 1rem; display: none; }
    #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.2s; }
  </style>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>PDF Compress</h1>
        <p class="tool-description">Reduce your PDF file size. All processing happens entirely in your browser.</p>
      </div>

      <div class="tool-panel glass-panel compress-layout">
        <div class="upload-zone" id="upload-zone">
          <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1" fill="none" style="margin-bottom: 1rem; color: var(--muted);">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <path d="M12 18v-6"></path><path d="M9 15l3 3 3-3"></path>
          </svg>
          <h3 style="margin-bottom: 0.5rem;">Drop a PDF file here</h3>
          <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem;">or click to browse</p>
          <button class="btn btn-secondary" id="btn-browse" style="margin: 0 auto;">Select PDF</button>
          <input type="file" id="file-input" accept="application/pdf" style="display: none;">
        </div>
        
        <div id="workspace" style="display: none;">
          <div class="file-info-card">
            <svg class="file-icon" viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
            <div class="file-details">
              <div class="file-name" id="ui-filename">document.pdf</div>
              <div class="file-size" id="ui-size">0 KB</div>
            </div>
            <button class="btn btn-secondary" id="btn-change" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Change File</button>
          </div>

          <div class="options-card" style="margin-top: 1.5rem;">
            <div class="form-group">
              <label>Compression Level</label>
              <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem;">Lowering quality flattens the PDF into images, reducing size but removing text selection.</div>
              <div class="slider-container">
                <input type="range" id="quality-slider" class="quality-slider" min="10" max="100" value="60" step="10">
                <span class="quality-label" id="quality-val">60%</span>
              </div>
            </div>
            
            <div id="progress-bar-container"><div id="progress-bar"></div></div>
            <div id="status-text" style="font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; text-align: center;"></div>

            <button class="btn btn-primary" id="btn-execute" style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem; margin-top: 1.5rem;">
              Compress PDF
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
