<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML Sitemap Generator - ALL IN ONE</title>
  <meta name="description" content="Generate XML sitemaps for your website.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .output-box {
      background: rgba(0,0,0,0.5); border: 1px solid var(--stroke); border-radius: 0.5rem;
      padding: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem; color: #93c5fd;
      white-space: pre; min-height: 400px; overflow-x: auto;
    }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>XML Sitemap Generator</h1>
        <p class="tool-description">Quickly create a manual sitemap.xml for small websites.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          
          <div class="form-group">
            <label>URLs (One per line)</label>
            <textarea id="in-urls" class="form-textarea" rows="8" placeholder="https://example.com/\nhttps://example.com/about\nhttps://example.com/contact"></textarea>
          </div>
          
          <div class="form-group">
            <label>Change Frequency</label>
            <select id="in-freq" class="form-input">
              <option value="daily">Daily</option>
              <option value="weekly" selected>Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
              <option value="never">Never</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>Priority (0.0 to 1.0)</label>
            <input type="number" id="in-priority" class="form-input" value="0.8" step="0.1" min="0" max="1">
          </div>
          
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">Generated sitemap.xml</label>
          <div id="output-code" class="output-box"></div>
          <button class="btn btn-primary" id="btn-copy" style="justify-content: center;">
            Copy XML
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
