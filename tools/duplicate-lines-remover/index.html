<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicate Lines Remover - ALL IN ONE</title>
  <meta name="description" content="Clean your text by instantly removing duplicate lines.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 768px) {
      .split-layout { grid-template-columns: 1fr; }
    }
    .panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .options-bar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .checkbox-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text); cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--accent); }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Duplicate Lines Remover</h1>
        <p class="tool-description">Instantly find and remove duplicate lines from lists or documents.</p>
      </div>

      <div class="tool-panel glass-panel">
        <div class="options-bar">
          <label class="checkbox-label">
            <input type="checkbox" id="opt-case" checked> Case Sensitive
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-trim" checked> Trim Whitespace First
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="opt-empty"> Remove Empty Lines
          </label>
        </div>

        <div class="split-layout">
          <div class="panel">
            <label style="font-weight: 600; font-size: 0.9rem;">Original Text</label>
            <textarea id="input-text" class="form-textarea font-mono" rows="15" placeholder="Paste your list here..."></textarea>
            <div class="toolbar">
              <span class="text-xs text-muted" id="input-count">0 lines</span>
              <button class="btn btn-secondary btn-sm" id="btn-clear">Clear</button>
            </div>
          </div>

          <div class="panel">
            <label style="font-weight: 600; font-size: 0.9rem;">Cleaned Text</label>
            <textarea id="output-text" class="form-textarea font-mono" rows="15" placeholder="Cleaned output..." readonly></textarea>
            <div class="toolbar">
              <span class="text-xs" id="output-count" style="color: var(--accent); font-weight: 600;">0 duplicates removed</span>
              <button class="btn btn-primary btn-sm" id="btn-copy">Copy Result</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
