<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Voucher Generator - ALL IN ONE</title>
  <meta name="description" content="Generate beautiful PDF travel, hotel, and flight vouchers.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .layout { display: flex; flex-direction: column; gap: 2rem; max-width: 900px; margin: 0 auto; }
    
    .section-card { background: var(--surface); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; }
    .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; color: var(--accent); border-bottom: 1px solid var(--stroke); padding-bottom: 0.5rem; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  </style>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>Travel Voucher Generator</h1>
        <p class="tool-description">Create professional PDF travel vouchers for hotels, flights, and tours.</p>
      </div>

      <div class="layout">
        
        <div class="grid-2">
          <!-- Agency -->
          <div class="section-card">
            <div class="section-title">Agency Information</div>
            <div class="form-group"><label>Agency Name</label><input type="text" id="tv-agency" class="form-input" placeholder="Global Travel Co."></div>
            <div class="form-group"><label>Contact Email</label><input type="text" id="tv-email" class="form-input" placeholder="booking@globaltravel.com"></div>
            <div class="form-group"><label>Contact Phone</label><input type="text" id="tv-phone" class="form-input" placeholder="+1 800 123 4567"></div>
          </div>
          
          <!-- Passenger -->
          <div class="section-card">
            <div class="section-title">Passenger Details</div>
            <div class="form-group"><label>Lead Passenger Name</label><input type="text" id="tv-name" class="form-input" placeholder="John Doe"></div>
            <div class="grid-2">
              <div class="form-group"><label>Adults</label><input type="number" id="tv-adults" class="form-input" value="2" min="1"></div>
              <div class="form-group"><label>Children</label><input type="number" id="tv-children" class="form-input" value="0" min="0"></div>
            </div>
            <div class="form-group"><label>Booking Ref / PNR</label><input type="text" id="tv-pnr" class="form-input" value="AB12CD34"></div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-title">Service Details</div>
          <div class="grid-3">
            <div class="form-group">
              <label>Service Type</label>
              <select id="tv-type" class="form-input">
                <option value="Hotel Accommodation">Hotel Accommodation</option>
                <option value="Flight Ticket">Flight Ticket</option>
                <option value="Tour / Excursion">Tour / Excursion</option>
                <option value="Airport Transfer">Airport Transfer</option>
              </select>
            </div>
            <div class="form-group"><label>Check-in / Start Date</label><input type="date" id="tv-start" class="form-input"></div>
            <div class="form-group"><label>Check-out / End Date</label><input type="date" id="tv-end" class="form-input"></div>
          </div>
          <div class="form-group"><label>Service Provider (e.g., Hotel Name)</label><input type="text" id="tv-provider" class="form-input" placeholder="Grand Resort & Spa"></div>
          <div class="form-group"><label>Service Description (Room Type, Itinerary, etc.)</label><textarea id="tv-desc" class="form-input" rows="3" placeholder="1x Deluxe Double Room, Sea View. Breakfast Included."></textarea></div>
          <div class="form-group"><label>Special Requests / Notes</label><textarea id="tv-notes" class="form-input" rows="2" placeholder="Late check-in requested."></textarea></div>
        </div>

        <button class="btn btn-primary" id="btn-generate" style="padding: 1.5rem; font-size: 1.2rem; justify-content: center;">
          Generate Travel Voucher
        </button>
        
      </div>
    </div>
  </main>
</body>
</html>
