<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive HTML Email Template Generator - ALL IN ONE</title>
  <meta name="description" content="Design and export responsive, cross-client HTML email templates. Visual module builder for headers, hero banners, CTA buttons, product cards, and footers with real-time desktop and mobile previews.">
  <meta name="keywords" content="email template generator, responsive html email, newsletter builder, email designer, bulletproof email html, free email template">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/email-template-generator/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ALL IN ONE">
  <meta property="og:url" content="https://sami12901.github.io/ALL-IN-ONE-v1/tools/email-template-generator/">
  <meta property="og:title" content="Responsive HTML Email Template Generator - ALL IN ONE">
  <meta property="og:description" content="Visual builder for responsive HTML email templates with desktop & mobile previews and 1-click HTML export.">
  <meta property="og:image" content="https://sami12901.github.io/ALL-IN-ONE-v1/assets/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://sami12901.github.io/ALL-IN-ONE-v1/tools/email-template-generator/">
  <meta name="twitter:title" content="Responsive HTML Email Template Generator - ALL IN ONE">
  <meta name="twitter:description" content="Design and export bulletproof responsive HTML email templates.">
  <meta name="twitter:image" content="https://sami12901.github.io/ALL-IN-ONE-v1/assets/icons/icon-512.png">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">

  <style>
    .builder-layout {
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 1100px) {
      .builder-layout {
        grid-template-columns: 1fr;
      }
    }
    .accordion-section {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .accordion-header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      user-select: none;
      transition: background 0.2s;
    }
    .accordion-header:hover {
      background: rgba(255, 255, 255, 0.03);
    }
    .accordion-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .accordion-section.collapsed .accordion-body {
      display: none;
    }
    .section-toggle-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .color-picker-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .color-input-field {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .color-input-field input[type="color"] {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
    }
    .preview-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--bg-tertiary);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
    }
    .view-mode-tabs {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 2px;
    }
    .view-tab-btn {
      padding: 0.35rem 0.85rem;
      font-size: 0.775rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .view-tab-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
    }
    .preview-stage-wrap {
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      background: #0d0f14;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.5rem 0.5rem;
      min-height: 600px;
      overflow-x: auto;
    }
    .email-iframe-container {
      transition: width 0.3s ease;
      background: transparent;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: hidden;
    }
    .email-iframe-container.mode-desktop {
      width: 620px;
    }
    .email-iframe-container.mode-mobile {
      width: 375px;
      border: 8px solid #2d3342;
      border-radius: 28px;
    }
    #preview-iframe {
      width: 100%;
      height: 650px;
      border: none;
      display: block;
      background: #ffffff;
    }
  </style>

  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Responsive HTML Email Template Generator</h1>
        <p class="tool-description">Visually build, customize, and export bulletproof responsive HTML emails compatible with Gmail, Apple Mail, Outlook, and mobile clients.</p>
      </div>

      <!-- Presets & Quick Bar -->
      <div class="action-bar" style="margin-bottom: 0.75rem; align-items: center;">
        <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">Start with a Template:</span>
        <button class="preset-chip" data-template="welcome" style="cursor: pointer;">Welcome &amp; Onboarding</button>
        <button class="preset-chip" data-template="launch" style="cursor: pointer;">Product Launch</button>
        <button class="preset-chip" data-template="digest" style="cursor: pointer;">Weekly Digest</button>
        <button class="preset-chip" data-template="promo" style="cursor: pointer;">Promo Sale / Discount</button>
      </div>

      <!-- Builder Workspace -->
      <div class="builder-layout">
        
        <!-- Left: Configuration Panels & Modules -->
        <div class="tool-panel glass-panel" style="padding: 1.25rem; max-height: 850px; overflow-y: auto;">
          <h2 class="panel-title" style="margin-bottom: 0.75rem;">Template Modules</h2>

          <!-- 1. Brand Styling & Palette -->
          <div class="accordion-section" id="sec-style">
            <div class="accordion-header">
              <span>🎨 Global Brand Styling</span>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="color-picker-row">
                <div class="form-group">
                  <label>Primary Accent</label>
                  <div class="color-input-field">
                    <input type="color" id="cfg-accent" value="#4e85bf">
                    <input type="text" id="cfg-accent-hex" class="form-input" value="#4e85bf" style="padding: 0.35rem 0.5rem; font-family: monospace; font-size: 0.8rem;">
                  </div>
                </div>
                <div class="form-group">
                  <label>Email Canvas Bg</label>
                  <div class="color-input-field">
                    <input type="color" id="cfg-outer-bg" value="#f4f5f7">
                    <input type="text" id="cfg-outer-bg-hex" class="form-input" value="#f4f5f7" style="padding: 0.35rem 0.5rem; font-family: monospace; font-size: 0.8rem;">
                  </div>
                </div>
              </div>
              <div class="color-picker-row">
                <div class="form-group">
                  <label>Inner Card Bg</label>
                  <div class="color-input-field">
                    <input type="color" id="cfg-inner-bg" value="#ffffff">
                    <input type="text" id="cfg-inner-bg-hex" class="form-input" value="#ffffff" style="padding: 0.35rem 0.5rem; font-family: monospace; font-size: 0.8rem;">
                  </div>
                </div>
                <div class="form-group">
                  <label>Body Text Color</label>
                  <div class="color-input-field">
                    <input type="color" id="cfg-text-color" value="#333333">
                    <input type="text" id="cfg-text-color-hex" class="form-input" value="#333333" style="padding: 0.35rem 0.5rem; font-family: monospace; font-size: 0.8rem;">
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="cfg-font">Font Family</label>
                <select id="cfg-font" class="form-select" style="padding: 0.4rem 0.75rem; font-size: 0.85rem;">
                  <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" selected>Modern Sans-Serif (System, Helvetica, Arial)</option>
                  <option value="Georgia, 'Times New Roman', Times, serif">Editorial Serif (Georgia, Times)</option>
                  <option value="'Courier New', Courier, monospace">Monospace (Courier)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 2. Header & Logo Module -->
          <div class="accordion-section" id="sec-header">
            <div class="accordion-header">
              <label class="section-toggle-label" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk-mod-header" checked>
                <span>🏷️ Brand Header</span>
              </label>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="form-group">
                <label for="cfg-brand-name">Brand / Company Name</label>
                <input type="text" id="cfg-brand-name" class="form-input" value="ALL IN ONE">
              </div>
              <div class="form-group">
                <label for="cfg-logo-url">Logo Image URL (Optional)</label>
                <input type="text" id="cfg-logo-url" class="form-input" placeholder="https://example.com/logo.png">
                <span style="font-size: 0.725rem; color: var(--text-tertiary);">Leave empty to render styled brand text.</span>
              </div>
              <div class="form-group">
                <label for="cfg-header-align">Header Alignment</label>
                <select id="cfg-header-align" class="form-select" style="padding: 0.4rem 0.75rem; font-size: 0.85rem;">
                  <option value="center" selected>Center</option>
                  <option value="left">Left</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. Hero Banner Module -->
          <div class="accordion-section" id="sec-hero">
            <div class="accordion-header">
              <label class="section-toggle-label" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk-mod-hero" checked>
                <span>🖼️ Hero Banner Image</span>
              </label>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="form-group">
                <label for="cfg-hero-url">Hero Image URL</label>
                <input type="text" id="cfg-hero-url" class="form-input" value="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1200&auto=format&fit=crop&q=80">
              </div>
              <div class="form-group">
                <label for="cfg-hero-alt">Image Alt Text</label>
                <input type="text" id="cfg-hero-alt" class="form-input" value="Welcome Banner">
              </div>
            </div>
          </div>

          <!-- 4. Content & Heading Module -->
          <div class="accordion-section" id="sec-content">
            <div class="accordion-header">
              <label class="section-toggle-label" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk-mod-content" checked>
                <span>✍️ Main Heading &amp; Body</span>
              </label>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="form-group">
                <label for="cfg-heading-text">Main Headline</label>
                <input type="text" id="cfg-heading-text" class="form-input" value="Welcome to the next generation of creative tools.">
              </div>
              <div class="form-group">
                <label for="cfg-body-text">Body Content</label>
                <textarea id="cfg-body-text" class="form-textarea" style="min-height: 100px; font-size: 0.875rem;">We are thrilled to welcome you on board! You now have full access to our curated collection of online utilities and productivity engines. Discover high-performance tools engineered to streamline your everyday workflows.</textarea>
              </div>
              <div class="form-group">
                <label for="cfg-content-align">Text Alignment</label>
                <select id="cfg-content-align" class="form-select" style="padding: 0.4rem 0.75rem; font-size: 0.85rem;">
                  <option value="left" selected>Left</option>
                  <option value="center">Center</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 5. Call To Action (CTA) Button -->
          <div class="accordion-section" id="sec-cta">
            <div class="accordion-header">
              <label class="section-toggle-label" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk-mod-cta" checked>
                <span>🔘 Call to Action Button</span>
              </label>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="form-group">
                <label for="cfg-cta-text">Button Text</label>
                <input type="text" id="cfg-cta-text" class="form-input" value="Explore Your Dashboard &rarr;">
              </div>
              <div class="form-group">
                <label for="cfg-cta-url">Destination URL</label>
                <input type="text" id="cfg-cta-url" class="form-input" value="https://example.com/dashboard">
              </div>
              <div class="form-group">
                <label for="cfg-cta-align">Button Alignment</label>
                <select id="cfg-cta-align" class="form-select" style="padding: 0.4rem 0.75rem; font-size: 0.85rem;">
                  <option value="center" selected>Center</option>
                  <option value="left">Left</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 6. Product Highlight Box Module -->
          <div class="accordion-section" id="sec-product">
            <div class="accordion-header">
              <label class="section-toggle-label" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk-mod-product" checked>
                <span>📦 Product / Feature Highlight Box</span>
              </label>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="form-group">
                <label for="cfg-product-title">Feature / Product Title</label>
                <input type="text" id="cfg-product-title" class="form-input" value="Pro Workspace Edition">
              </div>
              <div class="form-group">
                <label for="cfg-product-badge">Badge / Price Tag</label>
                <input type="text" id="cfg-product-badge" class="form-input" value="SPECIAL OFFER - 50% OFF">
              </div>
              <div class="form-group">
                <label for="cfg-product-desc">Short Description</label>
                <input type="text" id="cfg-product-desc" class="form-input" value="Unlock infinite automation runs, premium exports, and priority support.">
              </div>
              <div class="form-group">
                <label for="cfg-product-btn-text">Box Button Text</label>
                <input type="text" id="cfg-product-btn-text" class="form-input" value="Claim Discount">
              </div>
            </div>
          </div>

          <!-- 7. Footer & Unsubscribe Module -->
          <div class="accordion-section" id="sec-footer">
            <div class="accordion-header">
              <label class="section-toggle-label" onclick="event.stopPropagation()">
                <input type="checkbox" id="chk-mod-footer" checked>
                <span>📄 Compliance Footer &amp; Social Links</span>
              </label>
              <span class="chevron">&#9662;</span>
            </div>
            <div class="accordion-body">
              <div class="form-group">
                <label for="cfg-footer-company">Company Name &amp; Address</label>
                <input type="text" id="cfg-footer-company" class="form-input" value="ALL IN ONE Technologies Inc. • 123 Innovation Way, Suite 400, San Francisco, CA">
              </div>
              <div class="form-group">
                <label class="checkbox-label" style="font-size: 0.8rem; min-height: auto;">
                  <input type="checkbox" id="cfg-show-social" checked>
                  Include Social Links (Twitter, LinkedIn, GitHub)
                </label>
              </div>
              <div class="form-group">
                <label for="cfg-unsub-url">Unsubscribe URL</label>
                <input type="text" id="cfg-unsub-url" class="form-input" value="https://example.com/unsubscribe">
              </div>
            </div>
          </div>

        </div>

        <!-- Right: Live Real-time Desktop & Mobile Preview -->
        <div style="display: flex; flex-direction: column;">
          
          <div class="preview-header-bar">
            <div class="view-mode-tabs">
              <button class="view-tab-btn active" id="btn-view-desktop">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                Desktop (600px)
              </button>
              <button class="view-tab-btn" id="btn-view-mobile">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                Mobile (375px)
              </button>
            </div>

            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary" id="btn-copy-html" style="padding: 0.35rem 0.85rem; font-size: 0.8rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy HTML
              </button>
              <button class="btn btn-primary" id="btn-download-html" style="padding: 0.35rem 0.85rem; font-size: 0.8rem;">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download HTML Email
              </button>
            </div>
          </div>

          <div class="preview-stage-wrap">
            <div class="email-iframe-container mode-desktop" id="iframe-wrapper">
              <iframe id="preview-iframe" title="Interactive Email Preview"></iframe>
            </div>
          </div>

        </div>

      </div>
    
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <script type="application/ld+json">

  </script>
</body>
</html>
