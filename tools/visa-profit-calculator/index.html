<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Profit Calculator - ALL IN ONE</title>
  <meta name="description" content="Calculate your travel agency's profit margins on visa processing services.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="../../js/main.js" defer></script>
</head>
<body>
  <app-header></app-header>
  
  <main class="workspace-container">
    <app-breadcrumb tool-name="Visa Profit Calculator"></app-breadcrumb>

    <div class="workspace-grid" style="grid-template-columns: 1fr 1fr;">
      
      <!-- Input Panel -->
      <div class="workspace-panel glass-panel">
        <h2 class="panel-title">Visa Cost Details</h2>
        
        <div class="form-group">
          <label>Number of Applications</label>
          <input type="number" id="applicants" class="input-element" value="1" min="1">
        </div>

        <div class="form-group">
          <label>Embassy / Official Visa Fee (Per Person)</label>
          <input type="number" id="official-fee" class="input-element" value="5000" min="0">
        </div>
        
        <div class="form-group">
          <label>VFS / Processing Center Fee (Per Person)</label>
          <input type="number" id="vfs-fee" class="input-element" value="2000" min="0">
        </div>

        <div class="form-group">
          <label>Agent / Third Party Cost (Per Person)</label>
          <input type="number" id="agent-cost" class="input-element" value="0" min="0">
        </div>

        <div class="form-group">
          <label>Misc. Costs (Documents, Photos, Notary) (Total)</label>
          <input type="number" id="misc-cost" class="input-element" value="500" min="0">
        </div>

        <h2 class="panel-title" style="margin-top: 2rem;">Customer Billing</h2>

        <div class="form-group">
          <label>Amount Charged to Customer (Per Person)</label>
          <input type="number" id="customer-charge" class="input-element" value="9500" min="0">
        </div>

        <button id="calculate-btn" class="action-btn primary-btn" style="width: 100%; margin-top: 1rem;">
          Calculate Profit
        </button>
      </div>

      <!-- Output Panel -->
      <div class="workspace-panel glass-panel" style="display: flex; flex-direction: column;">
        <h2 class="panel-title">Profit Analysis</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
          
          <div style="background: var(--bg-tertiary); padding: 1.5rem; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border);">
            <div style="font-size: 0.8rem; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 0.5rem;">Total Cost</div>
            <div id="res-cost" style="font-size: 2rem; font-weight: 700; color: #ef4444; font-family: var(--font-display);">0</div>
          </div>
          
          <div style="background: var(--bg-tertiary); padding: 1.5rem; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border);">
            <div style="font-size: 0.8rem; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 0.5rem;">Total Revenue</div>
            <div id="res-revenue" style="font-size: 2rem; font-weight: 700; color: var(--text-primary); font-family: var(--font-display);">0</div>
          </div>

        </div>

        <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 2rem; border-radius: var(--radius-lg); text-align: center; margin-bottom: 2rem;">
          <div style="font-size: 1rem; color: #10b981; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; font-weight: 600;">Net Profit</div>
          <div id="res-profit" style="font-size: 3.5rem; font-weight: 800; color: #10b981; font-family: var(--font-display);">0</div>
          <div id="res-margin" style="font-size: 1rem; color: var(--text-secondary); margin-top: 0.5rem;">Margin: 0%</div>
        </div>

        <div style="flex: 1;">
          <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">Cost Breakdown</h3>
          <ul id="breakdown-list" style="list-style: none; padding: 0; margin: 0; color: var(--text-secondary); line-height: 1.8; font-size: 0.9rem;">
            <!-- Rendered via JS -->
          </ul>
        </div>

      </div>

    </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
