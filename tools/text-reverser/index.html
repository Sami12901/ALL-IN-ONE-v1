<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Reverser - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Reverse characters, words, or full sentences.">
  <meta name="keywords" content="reverse, flip, text, invert, free, online, tool, utility">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/text-reverser/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Text Reverser</h1>
        <p class="tool-description">Reverse characters, words, or full sentences.</p>
      </div>

      <!-- Tool Workspace -->
      
      <div class="tool-workarea split-view">
        <div class="tool-panel glass-panel">
          <div class="panel-title">Input Text</div>
          <div class="form-group">
            <textarea id="inputText" class="form-textarea" placeholder="Type or paste your text here..." autofocus></textarea>
          </div>
          <div class="form-group">
            <label for="reverseType">Reverse Options</label>
            <select id="reverseType" class="form-select">
              <option value="chars">Reverse Characters (entire text)</option>
              <option value="words">Reverse Words Order</option>
              <option value="lines">Reverse Lines Order</option>
            </select>
          </div>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="reverseCharsInWords">
              Reverse characters within each word
            </label>
          </div>
          <div class="action-bar">
            <button id="clearBtn" class="btn btn-secondary">Clear</button>
            <button id="reverseBtn" class="btn btn-primary" style="flex: 1;">Reverse</button>
          </div>
        </div>
        
        <div class="tool-panel glass-panel">
          <div class="panel-title">Reversed Output</div>
          <div class="output-box" id="outputArea" style="min-height: 250px;">
            <button id="copyBtn" class="copy-btn">Copy</button>
            <div id="resultText"></div>
          </div>
        </div>
      </div>
    
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <!-- Structured schema for search engine rich snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Text Reverser",
    "url": "https://sami12901.github.io/ALL-IN-ONE-v1/tools/text-reverser/",
    "description": "Reverse characters, words, or full sentences.",
    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>
</body>
</html>
