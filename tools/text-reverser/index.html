<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Reverser - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Reverse text instantly. Flip characters, reverse word order, or reverse lines. 100% free and offline-ready.">
  <meta name="keywords" content="text reverser, reverse text, flip words, backward text, reverse string, free, online, tool, utility">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/text-reverser/">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <link rel="stylesheet" href="style.css">
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="../../js/main.js"></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>
  
  <!-- Breadcrumbs -->
  <app-breadcrumbs></app-breadcrumbs>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">Text Reverser</h1>
        <p class="tool-description">Reverse your text instantly: flip characters, reverse word order, or reverse entire lines.</p>
      </div>

      <!-- Tool Workspace -->
      <div class="tool-workarea split-view">
        <!-- Input Panel -->
        <div class="tool-panel glass-panel">
          <h2 class="panel-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Original Text
          </h2>
          
          <div class="form-group" style="flex: 1;">
            <textarea id="input-text" class="form-textarea" placeholder="Paste or type your text here to reverse it..." style="height: 100%; min-height: 250px; resize: none;"></textarea>
          </div>
          
          <div class="action-bar" style="justify-content: space-between;">
            <div class="form-group" style="flex: 1; flex-direction: row; align-items: center; gap: 1rem;">
              <label for="reverse-mode" style="margin: 0; white-space: nowrap;">Mode:</label>
              <select id="reverse-mode" class="form-select" style="min-width: 150px;">
                <option value="chars">Reverse Characters</option>
                <option value="words">Reverse Words</option>
                <option value="both">Reverse Both</option>
                <option value="lines">Reverse Lines</option>
              </select>
            </div>
            <button id="clear-btn" class="btn btn-secondary">
              Clear
            </button>
          </div>
        </div>
        
        <!-- Output Panel -->
        <div class="tool-panel glass-panel">
          <h2 class="panel-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Reversed Text
          </h2>
          <div class="form-group" style="flex: 1; position: relative;">
            <textarea id="output-text" class="form-textarea" readonly style="height: 100%; min-height: 250px; resize: none; background: var(--bg-secondary); cursor: text;" placeholder="Reversed output will appear here..."></textarea>
            <button class="copy-btn" id="copy-btn" title="Copy to clipboard">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copy
            </button>
          </div>
        </div>
      </div>
      
    </div>
  </main>

  <!-- Footer Web Component -->
  <app-footer></app-footer>

  <script type="module" src="script.js"></script>
  
  <!-- Structured schema for search engine rich snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Text Reverser",
    "url": "https://sami12901.github.io/ALL-IN-ONE-v1/tools/text-reverser/",
    "description": "Reverse text instantly. Flip characters, reverse word order, or reverse lines.",
    "applicationCategory": "UtilityPage",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript. Requires HTML5."
  }
  </script>
</body>
</html>
