<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Builder Pro - Free Online Tool - ALL IN ONE</title>
  <meta name="description" content="Create, edit, and export professional presentations to PPTX and PDF.">
  <meta name="keywords" content="slide, presentation, pitch, deck, presentation builder pro, free, online, tool, utility">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sami12901.github.io/ALL-IN-ONE-v1/tools/presentation-builder-pro/">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <style>
    /* Specific overrides for this app to maximize canvas space */
    .tool-layout { padding: 1rem 0 !important; }
    .tool-container { max-width: 1600px !important; margin: 0 auto; width: 95%; height: 85vh; display: flex; flex-direction: column; }
    
    .builder-toolbar {
      display: flex;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid var(--stroke);
      align-items: center;
      flex-wrap: wrap;
    }
    
    .builder-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .builder-sidebar {
      width: 250px;
      border-right: 1px solid var(--stroke);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
    }
    
    .slide-thumbnail {
      aspect-ratio: 16/9;
      background: #fff;
      border: 2px solid var(--stroke);
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #333;
      transition: border-color 0.2s;
    }
    .slide-thumbnail.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .slide-number {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    .delete-slide {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--error);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      display: none;
    }
    .slide-thumbnail:hover .delete-slide { display: block; }
    
    .builder-canvas-container {
      flex: 1;
      padding: 2rem;
      background: rgba(10,10,10,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
    }
    
    .slide-canvas {
      width: 960px; /* Standard 16:9 1080p roughly */
      height: 540px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      transform-origin: center;
      color: #000;
    }
    
    .canvas-element {
      position: absolute;
      cursor: move;
      border: 1px dashed transparent;
    }
    
    .canvas-element:hover { border-color: rgba(0,0,0,0.2); }
    .canvas-element.selected { border-color: var(--accent); }
    
    .canvas-text {
      padding: 8px;
      min-width: 100px;
      min-height: 40px;
      outline: none;
    }
    
    .canvas-image {
      width: 200px;
      height: auto;
      pointer-events: none; /* Let the wrapper handle drag */
    }
    
    .resize-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--accent);
      bottom: -5px;
      right: -5px;
      cursor: se-resize;
      display: none;
    }
    .canvas-element.selected .resize-handle { display: block; }
    
    .prop-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 8px;
      padding: 10px;
      display: none;
      z-index: 100;
    }
  </style>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <!-- Header Web Component -->
  <app-header></app-header>

  <!-- Main Work Container -->
  <main class="tool-layout">
    <div class="container tool-container glass-panel" style="padding: 0;">
      
      <!-- Toolbar -->
      <div class="builder-toolbar">
        <h2 style="font-family: var(--font-display); font-size: 1.5rem; margin-right: auto; font-style: italic;">Presentation Builder</h2>
        
        <button id="add-slide-btn" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          Add Slide
        </button>
        
        <div style="width:1px; height:24px; background:var(--stroke); margin: 0 0.5rem;"></div>
        
        <button id="add-text-btn" class="btn btn-secondary">Add Text</button>
        <button id="add-image-btn" class="btn btn-secondary">Add Image</button>
        
        <input type="file" id="image-upload" accept="image/*" style="display:none;">
        
        <div style="width:1px; height:24px; background:var(--stroke); margin: 0 0.5rem;"></div>
        
        <button id="export-pptx-btn" class="btn btn-primary">Export PPTX</button>
        <button id="export-pdf-btn" class="btn btn-primary">Export PDF</button>
      </div>

      <div class="builder-main">
        <!-- Sidebar -->
        <div class="builder-sidebar" id="slide-thumbnails">
          <!-- Thumbnails injected here -->
        </div>

        <!-- Canvas -->
        <div class="builder-canvas-container" id="canvas-container">
          <div class="slide-canvas" id="slide-canvas">
            <!-- Active slide elements injected here -->
          </div>
          
          <!-- Element Properties Panel -->
          <div class="prop-panel" id="prop-panel">
            <div style="display:flex; flex-direction: column; gap: 8px;">
              <label style="font-size: 12px; color: var(--muted);">Font Size</label>
              <input type="number" id="prop-font-size" class="form-input" style="padding: 4px; font-size:12px; width: 60px;" value="24">
              <label style="font-size: 12px; color: var(--muted);">Color</label>
              <input type="color" id="prop-color" value="#000000" style="border:none; width:100%;">
              <button id="prop-delete" class="btn btn-secondary" style="padding: 4px 8px; font-size:12px; margin-top: 8px; color: var(--error);">Delete</button>
            </div>
          </div>
        </div>
      </div>
      
    </div>
  </main>
</body>
</html>
