<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Application Builder - ALL IN ONE</title>
  <meta name="description" content="Generate a clean, standardized Visa Application PDF form.">
  
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .layout { display: flex; flex-direction: column; gap: 2rem; max-width: 900px; margin: 0 auto; }
    
    .section-card { background: var(--surface); border: 1px solid var(--stroke); padding: 1.5rem; border-radius: 0.5rem; }
    .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; color: var(--accent); border-bottom: 1px solid var(--stroke); padding-bottom: 0.5rem; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  </style>
  
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header" style="text-align: center; max-width: 600px; margin: 0 auto 2rem;">
        <h1>Visa Application Builder</h1>
        <p class="tool-description">Generate a universally accepted, clean Visa Application PDF form filled with your details. Offline & secure.</p>
      </div>

      <div class="layout">
        
        <div class="section-card">
          <div class="section-title">1. Personal Information</div>
          <div class="grid-2">
            <div class="form-group"><label>Surname / Family Name</label><input type="text" id="v-surname" class="form-input"></div>
            <div class="form-group"><label>Given Names</label><input type="text" id="v-given" class="form-input"></div>
          </div>
          <div class="grid-3">
            <div class="form-group"><label>Date of Birth</label><input type="date" id="v-dob" class="form-input"></div>
            <div class="form-group"><label>Place of Birth</label><input type="text" id="v-pob" class="form-input"></div>
            <div class="form-group"><label>Current Nationality</label><input type="text" id="v-nat" class="form-input"></div>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label>Sex</label>
              <select id="v-sex" class="form-input">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Marital Status</label>
              <select id="v-marital" class="form-input">
                <option value="Single">Single</option>
                <option value="Married">Married</option>
                <option value="Divorced">Divorced</option>
                <option value="Widowed">Widowed</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-title">2. Passport Details</div>
          <div class="grid-2">
            <div class="form-group"><label>Passport Number</label><input type="text" id="v-pass-num" class="form-input"></div>
            <div class="form-group"><label>Issued By (Country/Authority)</label><input type="text" id="v-pass-issue" class="form-input"></div>
          </div>
          <div class="grid-2">
            <div class="form-group"><label>Date of Issue</label><input type="date" id="v-pass-date" class="form-input"></div>
            <div class="form-group"><label>Valid Until</label><input type="date" id="v-pass-exp" class="form-input"></div>
          </div>
        </div>

        <div class="section-card">
          <div class="section-title">3. Travel Information</div>
          <div class="grid-2">
            <div class="form-group"><label>Destination Country</label><input type="text" id="v-dest" class="form-input" placeholder="e.g. United Kingdom"></div>
            <div class="form-group">
              <label>Purpose of Journey</label>
              <select id="v-purpose" class="form-input">
                <option value="Tourism">Tourism</option>
                <option value="Business">Business</option>
                <option value="Study">Study</option>
                <option value="Medical">Medical Treatment</option>
                <option value="Transit">Transit</option>
              </select>
            </div>
          </div>
          <div class="grid-3">
            <div class="form-group"><label>Intended Date of Arrival</label><input type="date" id="v-arr" class="form-input"></div>
            <div class="form-group"><label>Intended Date of Departure</label><input type="date" id="v-dep" class="form-input"></div>
            <div class="form-group">
              <label>Number of Entries</label>
              <select id="v-entries" class="form-input">
                <option value="Single">Single</option>
                <option value="Multiple">Multiple</option>
              </select>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" id="btn-generate" style="padding: 1.5rem; font-size: 1.2rem; justify-content: center;">
          Generate Official PDF Form
        </button>
        
      </div>
    </div>
  </main>
</body>
</html>
