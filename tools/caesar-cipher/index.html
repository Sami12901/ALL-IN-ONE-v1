<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caesar Cipher Tool - ALL IN ONE</title>
  <meta name="description" content="Encrypt and decrypt messages using the classic Caesar Cipher algorithm.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .split-layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 0.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; }
    .options-bar { 
      display: flex; gap: 1.5rem; align-items: center; margin-bottom: 1.5rem; 
      background: var(--surface); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--stroke);
    }
    .shift-control { display: flex; align-items: center; gap: 0.5rem; }
    .shift-input { width: 80px; padding: 0.5rem; text-align: center; font-size: 1.1rem; }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Caesar Cipher</h1>
        <p class="tool-description">Encrypt and decrypt messages by shifting the alphabet.</p>
      </div>

      <div class="tool-panel glass-panel">
        <div class="options-bar">
          <div class="shift-control">
            <label style="font-weight: 600;">Shift (Key):</label>
            <input type="number" id="shift-key" class="form-input shift-input" value="3" min="-26" max="26">
          </div>
          <div class="shift-control">
            <label style="font-weight: 600;">Action:</label>
            <select id="action-type" class="form-input" style="padding: 0.5rem;">
              <option value="encode">Encode (Shift Right)</option>
              <option value="decode">Decode (Shift Left)</option>
            </select>
          </div>
        </div>

        <div class="split-layout">
          <div class="panel">
            <label style="font-weight: 600; font-size: 0.9rem;">Input Text</label>
            <textarea id="input-text" class="form-textarea" rows="8" placeholder="Enter secret message..."></textarea>
            <div class="toolbar">
              <button class="btn btn-secondary btn-sm" id="btn-clear">Clear</button>
            </div>
          </div>

          <div class="panel">
            <label style="font-weight: 600; font-size: 0.9rem;">Result</label>
            <textarea id="output-text" class="form-textarea" rows="8" placeholder="Result will appear here..." readonly></textarea>
            <div class="toolbar">
              <span></span>
              <button class="btn btn-primary btn-sm" id="btn-copy">Copy Result</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
