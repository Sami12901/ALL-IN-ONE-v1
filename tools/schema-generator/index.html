<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schema Markup Generator - ALL IN ONE</title>
  <meta name="description" content="Generate JSON-LD Schema markup for your website to improve SEO.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/portfolio.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
    .panel { display: flex; flex-direction: column; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.5rem; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .output-box {
      background: rgba(0,0,0,0.5); border: 1px solid var(--stroke); border-radius: 0.5rem;
      padding: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem; color: #facc15;
      white-space: pre; min-height: 400px; overflow-x: auto;
    }
  </style>
  <script type="module" src="../../js/components.js"></script>
  <script type="module" src="./script.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <app-breadcrumbs></app-breadcrumbs>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="tool-header">
        <h1>Schema Markup Generator</h1>
        <p class="tool-description">Create structured JSON-LD data for rich snippets in Google Search.</p>
      </div>

      <div class="tool-panel glass-panel layout">
        <div class="panel">
          
          <div class="form-group">
            <label>Schema Type</label>
            <select id="schema-type" class="form-input">
              <option value="Article">Article / Blog Post</option>
              <option value="LocalBusiness">Local Business</option>
              <option value="Person">Person</option>
            </select>
          </div>
          
          <div id="fields-container">
            <!-- Dynamic fields injected here -->
          </div>
          
        </div>

        <div class="panel">
          <label style="font-weight: 600; font-size: 0.9rem;">JSON-LD Code</label>
          <div id="output-code" class="output-box"></div>
          <button class="btn btn-primary" id="btn-copy" style="justify-content: center;">
            Copy Script Tag
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
