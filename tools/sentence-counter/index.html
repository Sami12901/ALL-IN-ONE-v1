<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Counter - ALL IN ONE</title>
  <meta name="description" content="Count total sentences, words, and characters in a text instantly. Free online sentence counter tool.">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/tools-shared.css">
  <script type="module" src="../../js/components.js"></script>
  <link rel="manifest" href="../../pwa/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="../../assets/icons/favicon.ico">
  <script type="module" src="../../js/main.js" defer></script>
</head>
<body>
  <app-header></app-header>

  <main class="tool-layout">
    <div class="container tool-container">
      <div class="breadcrumb-container">
        <ul class="breadcrumbs">
          <li class="breadcrumb-item"><a href="../../index.html">Dashboard</a></li>
          <li class="breadcrumb-item"><a href="#">Text Utilities</a></li>
          <li class="breadcrumb-item active">Sentence Counter</li>
        </ul>
      </div>

      <div class="tool-header">
        <h1 class="gradient-text" style="font-family: var(--font-display); font-weight: 800;">Sentence Counter</h1>
        <p class="tool-description">Instantly count sentences, paragraphs, words, and characters in your text. Perfect for writers, students, and editors.</p>
      </div>

      <div class="tool-workarea">
        <!-- Input Section -->
        <div class="glass-panel tool-panel" style="margin-bottom: 1.5rem;">
          <div class="panel-title">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            Text Input
          </div>
          <div class="form-group" style="flex: 1;">
            <textarea id="text-input" class="form-textarea" placeholder="Paste your text here... 

Example: Hello world. This is a sentence! Is this a third sentence?" style="min-height: 250px; font-size: 1.1rem; line-height: 1.6;"></textarea>
          </div>
          <div class="action-bar">
            <button id="clear-btn" class="btn btn-secondary">Clear Input</button>
            <button id="paste-btn" class="btn btn-secondary">Paste from Clipboard</button>
          </div>
        </div>

        <!-- Metrics Section -->
        <div class="metrics-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          
          <!-- Metric Card -->
          <div class="glass-panel" style="padding: 1.5rem; text-align: center;">
            <h3 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Sentences</h3>
            <div id="metric-sentences" style="font-size: 3rem; font-weight: 800; color: var(--accent); font-family: var(--font-display);">0</div>
          </div>
          
          <!-- Metric Card -->
          <div class="glass-panel" style="padding: 1.5rem; text-align: center;">
            <h3 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Words</h3>
            <div id="metric-words" style="font-size: 3rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-display);">0</div>
          </div>

          <!-- Metric Card -->
          <div class="glass-panel" style="padding: 1.5rem; text-align: center;">
            <h3 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Paragraphs</h3>
            <div id="metric-paragraphs" style="font-size: 3rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-display);">0</div>
          </div>

          <!-- Metric Card -->
          <div class="glass-panel" style="padding: 1.5rem; text-align: center;">
            <h3 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Characters</h3>
            <div id="metric-chars" style="font-size: 3rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-display);">0</div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
  <script src="script.js"></script>
</body>
</html>
